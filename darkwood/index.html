        else start();
      }
      by += 32;
      if (UI.button('t-opt', bx, by, bw, 22, 'OPTIONS', { theme: 'stone' })) App.settings();
      F.draw('v' + App.VERSION, w - 4, h - 10, '#445', { align: 'right' });
      F.draw('A remake of Darkwood', 4, h - 10, '#445');
    },
  });

  // ---------------------------------------------------------------
  // TOWN
  // ---------------------------------------------------------------
  const PLACES = [
    { id: 'arena', label: 'ARENA', icon: 'm_arena', theme: 'red', go: () => App.go('arena') },
    { id: 'smithy', label: 'SMITHY', icon: 'm_smithy', go: () => App.go('smithy') },
    { id: 'apothecary', label: 'APOTHECARY', icon: 'm_apothecary', go: () => App.go('apothecary') },
    { id: 'inn', label: 'INN', icon: 'm_inn', go: () => App.go('inn') },
    { id: 'hero', label: 'HERO', icon: 'm_hero', go: () => App.go('hero') },
    { id: 'options', label: 'OPTIONS', icon: 'ui_music', go: () => App.settings() },
  ];

  const gateTap = () => {
    if (S.flags.gateOpen) {
      App.sfx('gate');
      App.message('THE NORTH GATE', 'The great gate stands open. Beyond it the road winds into wild country: caves, ruins, and far to the north, the black town of {red}Blackstone{/} by the sea.\n\nYour journey north begins in the next chapter.', null, { icon: A.icon('m_gate') });
    } else {
      App.sfx('deny');
      App.message('THE NORTH GATE', 'Sealed with chains and the old king\'s wax. Only the {gold}Captain of the Guard{/} may order it opened.\n\nThe city crowns its Captain in the Arena: defeat the {red}Red Dragon{/}.', null, { icon: A.icon('m_gate') });
    }
  };

  App.register('town', {
    enter(params) {
      App.music('town');
      if (params && params.intro) {
        App.message('DARKWOOD', `Welcome to Darkwood, ${S.p.name}, the safest city in the kingdom.\n\nThe Arena crowns a Captain of the Guard each generation. Fight your way up its four rings, buy better steel, and face the {red}Red Dragon{/}.\n\nIn battle, watch which side a monster winds up from, then {gold}block that side{/}. Block at the last moment to {gold}parry{/}.`, () => App.levelUps());
      } else if (S.p.pendingLevels.length) {
        App.levelUps();
      }
    },
    draw(dt, t) {
      const w = G.w, h = G.h, top = App.HUD_H;
      const panelH = 104;
      const sceneH = h - top - panelH;
      const state = { gateOpen: !!S.flags.gateOpen };
      A.drawScene('town', 0, top, w, sceneH, App.t, state);

      // tappable buildings with name plaques
      for (const hs of A.hotspots('town', w, sceneH, state)) {
        const place = PLACES.find(p => p.id === hs.id);
        const pressed = UI.isPressed('hs-' + hs.id);
        if (UI.tap('hs-' + hs.id, hs.x, top + hs.y, hs.w, hs.h)) {
          App.sfx('door');
          if (hs.id === 'gate') gateTap(); else if (place) place.go();
        }
        const label = hs.label || (place ? place.label : hs.id.toUpperCase());
        const lw = F.measure(label) + 6;
        const lx = Math.round(hs.x + hs.w / 2 - lw / 2), ly = top + hs.y + hs.h - 12;
        G.dither(lx, ly, lw, 10, null, '#000', pressed ? 14 : 10);
        F.draw(label, lx + 3, ly + 2, pressed ? '#fff' : hs.id === 'arena' ? '#fd5' : '#ddc', { shadow: true });
      }

      // quest banner
      if (S.quest) {
        const txt = `Oath: slay the {red}${S.quest.enemy}{/} · {gold}${S.quest.reward}g`;
        const tw = F.measure(txt) + 12;
        const bx = Math.floor((w - tw) / 2);
        UI.panel(bx, top + 3, tw, 15, 'parch');
        F.draw(txt, bx + 6, top + 7, '#321');
      }

      App.drawHud();

      // bottom panel
      const py = h - panelH;
      UI.panel(0, py, w, panelH, 'stone');
      const pad = 6, gap = 4;
      const bw = Math.floor((w - pad * 2 - gap) / 2), bh = 28;
      PLACES.forEach((pl, i) => {
        const col = i % 2, row = Math.floor(i / 2);
        const bx = pad + col * (bw + gap), by = py + pad + row * (bh + gap);
        let sub;
        if (pl.id === 'inn') sub = `Rest ${Gm.innCost()}g`;
        if (pl.id === 'arena') sub = `Ring ${D.TIERS[Gm.highestTier() - 1].short} · ${Gm.totalDefeated()}/20`;
        if (pl.id === 'hero' && S.p.pendingLevels.length) sub = 'Level up!';
        if (UI.button('town-' + pl.id, bx, by, bw, bh, pl.label, { icon: A.icon(pl.icon), theme: pl.theme || 'stone', sub, key: String(i + 1) })) {
          pl.go();
        }
      });
    },
  });
})();

</script>
<script>
// ---- 33_screens_shops.js ----
// ================================================================
// SHOPS & INN — the Weapon Smith, the Apothecary, the Rusty Flagon.
// ================================================================
(() => {
  const G = DW.gfx, F = DW.font, UI = DW.ui, A = DW.art, FX = DW.fx, U = DW.util, P = DW.pal;
  const Gm = DW.game, S = DW.state, D = DW.data, App = DW.app;

  // ---------------------------------------------------------------
  // Shared list + detail layout
  // rows: [{ key, icon, name, nameCol, line2, right, rightCol, badge, badgeCol, dim }]
  // ---------------------------------------------------------------
  const ROW_H = 30;
  App.list = (id, rows, sel, x, y, w, h) => {
    let out = sel;
    UI.panel(x, y, w, h, 'dark');
    UI.scroll(id, x + 1, y + 1, w - 2, h - 2, rows.length * ROW_H + 2, oy => {
      rows.forEach((r, i) => {
        const ry = oy + 1 + i * ROW_H;
        if (ry > y + h || ry + ROW_H < y) return;
        const isSel = i === sel;
        const pressed = UI.isPressed(id + ':' + i);
        if (UI.tap(id + ':' + i, x + 1, ry, w - 6, ROW_H - 1)) { out = i; App.sfx('tap'); }
        if (isSel || pressed) G.rect(x + 2, ry, w - 7, ROW_H - 1, isSel ? '#334' : '#223');
        if (isSel) G.frame(x + 2, ry, w - 7, ROW_H - 1, '#c92');
        G.hline(x + 4, x + w - 8, ry + ROW_H - 1, '#223');
        G.rect(x + 5, ry + 6, 18, 18, '#000');
        G.rect(x + 6, ry + 7, 16, 16, '#223');
        if (r.icon) G.blit(r.icon, x + 7, ry + 8, r.dim ? { fade: 7 } : undefined);
        F.draw(r.name, x + 28, ry + 5, r.dim ? '#667' : r.nameCol || P.c.bright, { shadow: true });
        if (r.line2) F.draw(r.line2, x + 28, ry + 16, r.dim ? '#556' : P.c.dim);
        if (r.right) F.draw(r.right, x + w - 9, ry + 5, r.rightCol || P.c.gold, { align: 'right', shadow: true });
        if (r.badge) F.draw(r.badge, x + w - 9, ry + 16, r.badgeCol || P.c.green, { align: 'right' });
      });
    });
    return out;
  };

  // Detail panel with title, wrapped text and an action button. Returns true when the button is tapped.
  App.detail = (x, y, w, h, title, text, extra, btn) => {
    UI.panel(x, y, w, h, 'stone');
    F.draw(title, x + 8, y + 7, P.c.gold, { shadow: true });
    const bw = btn ? 74 : 0;
    const lines = F.wrap(text, w - 16 - (btn ? 0 : 0));
    let cy = y + 19;
    lines.slice(0, 3).forEach(ln => { F.draw(ln, x + 8, cy, P.c.text, { shadow: true }); cy += 10; });
    if (extra) F.draw(extra, x + 8, y + h - 16, P.c.dim, { shadow: true });
    if (!btn) return false;
    return UI.button('detail-btn', x + w - bw - 6, y + h - 26, bw, 20, btn.label, { theme: btn.theme || 'gold', disabled: btn.disabled, sound: false, key: 'Enter' });
  };

  const traitLabel = w => {
    const t = Gm.trait(w);
    if (t.kind === 'crush') return `Crush ${t.n}`;
    if (t.kind === 'crit') return `Crit +${t.n}%`;
    if (t.kind === 'holy') return 'Holy';
    return '';
  };
  const sign = n => (n > 0 ? '+' + n : String(n));

  const buyFx = (res) => {
    if (res.ok) {
      App.sfx('buy'); UI.toast(res.msg, P.c.green);
      FX.burst(G.w >> 1, App.HUD_H + 6, { n: 10, cols: ['#fe6', '#fd5', '#c92'], speed: 50, grav: 90, life: 0.6 });
      App.save();
    } else { App.sfx('deny'); UI.toast(res.msg, P.c.red); UI.buzz(30); }
  };

  // ---------------------------------------------------------------
  // WEAPON SMITH
  // ---------------------------------------------------------------
  let wSel = 0;
  App.register('smithy', {
    enter() {
      App.music('town');
      const cur = D.WEAPONS.findIndex(w => w.name === S.p.weapon);
      wSel = Math.min(D.WEAPONS.length - 1, cur + 1);
      UI.scrollReset('wlist');
      const s = UI.scrollState('wlist'); s.off = Math.max(0, (wSel - 2) * ROW_H);
    },
    draw() {
      const w = G.w, h = G.h;
      const top = App.header('smithy', 'WEAPON SMITH', 96);
      const detH = 86;
      const b = Gm.damageBonus();
      const rows = D.WEAPONS.map(wp => {
        const eq = wp.name === S.p.weapon;
        const price = Gm.weaponPrice(wp);
        const afford = S.p.gold >= price;
        return {
          icon: A.icon('w_' + wp.look), name: wp.name, nameCol: eq ? P.c.gold : undefined,
          line2: `${wp.damage_min + b}-${wp.damage_max + b} dmg  SPD ${sign(wp.speed)}  ${traitLabel(wp)}`,
          right: eq ? '' : wp.cost === 0 ? 'free' : U.fmt(price) + 'g', rightCol: afford ? P.c.gold : P.c.redDim,
          badge: eq ? 'EQUIPPED' : '', badgeCol: P.c.gold,
        };
      });
      wSel = App.list('wlist', rows, wSel, 4, top + 2, w - 8, h - top - detH - 8);
      const wp = D.WEAPONS[wSel], cur = Gm.weaponData();
      const eq = wp.name === S.p.weapon;
      const dAvg = (wp.damage_min + wp.damage_max - cur.damage_min - cur.damage_max) / 2;
      const cmp = eq ? 'Your current weapon.' :
        `vs yours: dmg {${dAvg >= 0 ? 'green' : 'red'}}${dAvg >= 0 ? '+' : ''}${dAvg}{/}  spd {${wp.speed - cur.speed >= 0 ? 'green' : 'red'}}${sign(wp.speed - cur.speed)}{/}` +
        (Gm.tradeIn(cur.cost) ? `  · trade-in ${Gm.tradeIn(cur.cost)}g` : '');
      const price = Gm.weaponPrice(wp);
      if (App.detail(4, h - detH - 4, w - 8, detH, wp.name, wp.description, cmp,
        { label: eq ? 'OWNED' : `BUY ${U.fmt(price)}`, disabled: eq, theme: S.p.gold >= price ? 'gold' : 'stone' })) {
        if (wp.cost < cur.cost && S.p.gold >= price) {
          App.confirm('TRADE DOWN?', `The smith will take your ${cur.name} in part exchange for the cheaper ${wp.name}. Are you sure?`, () => buyFx(Gm.buyWeapon(wp.name)), 'TRADE');
        } else buyFx(Gm.buyWeapon(wp.name));
      }
      App.drawHud();
    },
  });

  // ---------------------------------------------------------------
  // APOTHECARY
  // ---------------------------------------------------------------
  const TABS = [
    { label: 'POTIONS', types: ['potion', 'mana'] },
    { label: 'ARMOUR', types: ['armor', 'ring'] },
    { label: 'ARCANE', types: ['tome', 'wand'] },
  ];
  let aTab = 0, aSel = 0;

  const itemLine = it => {
    switch (it.type) {
      case 'potion': return it.value >= 999 ? 'Restores all HP' : `Restores ${it.value} HP`;
      case 'mana': return `Restores ${it.value} MP`;
      case 'armor': case 'ring': return `+${it.value} defense`;
      case 'tome': return `+${it.value} ${it.stat.toUpperCase()}, permanent`;
      case 'wand': return `${it.charges} charges · ${it.value - (it.element === 'fire' ? 15 : 10)}-${it.value + (it.element === 'fire' ? 15 : 10)} dmg`;
    }
    return '';
  };

  App.register('apothecary', {
    enter() { App.music('town'); aSel = 0; UI.scrollReset('alist'); },
    draw() {
      const w = G.w, h = G.h;
      const top = App.header('apothecary', 'APOTHECARY', 96);
      const nt = UI.tabs('atabs', 4, top + 2, w - 8, 20, TABS.map(t => t.label), aTab);
      if (nt !== aTab) { aTab = nt; aSel = 0; UI.scrollReset('alist'); }
      const items = D.ITEMS.filter(i => TABS[aTab].types.includes(i.type));
      const detH = 86;
      const rows = items.map(it => {
        const st = Gm.itemStatus(it);
        const price = Gm.itemPrice(it);
        let badge = '';
        if (st === 'equipped') badge = 'EQUIPPED';
        else if (st === 'read') badge = 'STUDIED';
        else if ((it.type === 'potion' || it.type === 'mana') && S.p.potions[it.name]) badge = `carried ${S.p.potions[it.name]}`;
        else if (it.type === 'wand' && S.p.wands[it.name]) badge = `${S.p.wands[it.name]} charges`;
        return {
          icon: A.icon(it.icon), name: it.name, nameCol: st ? P.c.gold : undefined, line2: itemLine(it),
          right: st ? '' : U.fmt(price) + 'g', rightCol: S.p.gold >= price ? P.c.gold : P.c.redDim,
          badge, badgeCol: st ? P.c.gold : P.c.green, dim: st === 'read',
        };
      });
      aSel = Math.min(aSel, items.length - 1);
      aSel = App.list('alist', rows, aSel, 4, top + 25, w - 8, h - top - 25 - detH - 8);
      const it = items[aSel];
      const st = Gm.itemStatus(it);
      const price = Gm.itemPrice(it);
      let extra = '';
      if (it.type === 'armor' || it.type === 'ring') {
        const cur = it.type === 'armor' ? Gm.armorData() : Gm.ringData();
        extra = cur ? `Replaces your ${cur.name}${Gm.tradeIn(cur.cost) ? ` (trade-in ${Gm.tradeIn(cur.cost)}g)` : ''}.` : `Your defense: ${Gm.defense()}.`;
      } else if (it.type === 'potion' || it.type === 'mana') {
        extra = `Carried: ${S.p.potions[it.name] || 0}. Drink in battle from ITEMS.`;
      } else if (it.type === 'wand') {
        extra = `Charges carried: ${S.p.wands[it.name] || 0}. Buying adds ${it.charges}.`;
      }
      if (App.detail(4, h - detH - 4, w - 8, detH, it.name, it.description, extra,
        { label: st ? (st === 'read' ? 'STUDIED' : 'OWNED') : `BUY ${U.fmt(price)}`, disabled: !!st, theme: S.p.gold >= price ? 'gold' : 'stone' })) {
        buyFx(Gm.buyItem(it.name));
      }
      App.drawHud();
    },
  });

  // ---------------------------------------------------------------
  // THE RUSTY FLAGON
  // ---------------------------------------------------------------
  let rumor = 0;
  const offerQuest = q => {
    const e = Gm.enemyData(q.enemy);
    App.dialog('A STRANGER', Gm.questText(q), [
      { label: 'SWEAR THE OATH', theme: 'gold', onTap: () => { Gm.acceptQuest(q); App.save(); UI.toast(`You swore to slay the ${e.name}.`, P.c.gold); App.sfx('equip'); } },
      { label: 'LEAVE IT BE', theme: 'stone', key: 'Escape', sound: 'back' },
    ], { icon: A.enemyPortrait(e.name) });
  };

  App.register('inn', {
    enter() { App.music('town'); rumor = U.rand(0, D.RUMORS.length - 1); },
    draw() {
      const w = G.w, h = G.h, p = S.p;
      const top = App.header('inn', 'THE RUSTY FLAGON', 96);
      let y = top + 4;
      // rumour board
      const rumH = 64;
      UI.panel(4, y, w - 8, rumH, 'parch');
      F.draw('Overheard:', 12, y + 6, '#530');
      F.drawWrapped('"' + D.RUMORS[rumor] + '"', 12, y + 18, w - 24, '#321');
      y += rumH + 6;

      // oath
      if (S.quest) {
        UI.panel(4, y, w - 8, 34, 'dark');
        G.blit(A.enemyPortrait(S.quest.enemy), 9, y + 5);
        F.draw('Your oath: slay the {red}' + S.quest.enemy, 38, y + 7, P.c.text, { shadow: true });
        F.draw('Reward on victory: {gold}' + S.quest.reward + ' gold', 38, y + 19, P.c.dim);
        y += 40;
      }

      const bw = w - 8, cost = Gm.innCost();
      const full = p.hp >= p.maxHp && p.mp >= p.maxMp;
      if (UI.button('inn-rest', 4, y, bw, 34, `RENT A ROOM  ${cost}g`, { theme: full || p.gold < cost ? 'stone' : 'gold', icon: A.icon('m_inn'), sub: 'Full health and magic. Strangers talk.', sound: false })) {
        const r = Gm.rest();
        if (r.ok) {
          App.sfx('heal'); UI.toast(r.msg, P.c.green); App.save();
          FX.heal(w >> 1, h >> 1, 24);
          if (r.offer) offerQuest(r.offer);
        } else { App.sfx('deny'); UI.toast(r.msg, P.c.red); }
      }
      y += 40;
      if (UI.button('inn-stable', 4, y, bw, 30, 'SLEEP IN THE STABLES', { theme: 'stone', sub: 'Free. Recover to half health and magic.', sound: false })) {
        const r = Gm.stables();
        if (r.ok) { App.sfx('heal'); UI.toast(r.msg, P.c.green); App.save(); }
        else { App.sfx('deny'); UI.toast(r.msg, P.c.dim); }
      }
      y += 36;
      if (UI.button('inn-listen', 4, y, bw, 24, 'LISTEN TO THE ROOM', { theme: 'stone' })) {
        rumor = (rumor + 1 + U.rand(0, D.RUMORS.length - 2)) % D.RUMORS.length;
      }
      App.drawHud();
    },
  });
})();

</script>
<script>
// ---- 34_screens_arena.js ----
// ================================================================
// ARENA (choose a foe) and HERO (stats, skills, bestiary) screens
// ================================================================
(() => {
  const G = DW.gfx, F = DW.font, UI = DW.ui, A = DW.art, FX = DW.fx, U = DW.util, P = DW.pal;
  const Gm = DW.game, S = DW.state, D = DW.data, App = DW.app, C = DW.combat;

  const SPECIAL = {
    drain: '{purple}Drains XP on unblocked hits',
    regen: '{green}Regenerates each turn (fire stops it)',
    petrify: '{red}Its gaze can petrify you',
    fire: '{orange}Fire: armour only half protects',
    none: '',
  };
  const KIND = { beast: 'Beast', humanoid: 'Humanoid', undead: 'Undead', giant: 'Giant', fiend: 'Fiend', dragon: 'Dragon' };

  // Rough danger estimate for the player right now.
  App.danger = e => {
    const avgHit = Math.max(1, (Gm.attackRange()[0] + Gm.attackRange()[1]) / 2 - Math.max(0, e.armor - (Gm.trait().kind === 'crush' ? Gm.trait().n : 0)));
    const turns = e.hp / avgHit;
    const rate = e.speed / Gm.speed();
    const hit = Math.max(1, (e.damage_min + e.damage_max) / 2 - (e.special === 'fire' ? Gm.defense() / 4 : Gm.defense() / 2));
    const taken = turns * rate * hit * 0.5;
    const r = taken / S.p.maxHp;
    if (r < 0.35) return ['Easy', P.c.green];
    if (r < 0.7) return ['Fair', P.c.gold];
    if (r < 1.1) return ['Hard', P.c.orange];
    return ['Deadly', P.c.red];
  };

  let tierSel = 1, eSel = 0;
  const tierEnemies = t => D.ENEMIES.filter(e => e.tier === t);

  App.register('arena', {
    enter(params) {
      App.music('town');
      tierSel = params && params.tier ? params.tier : Gm.highestTier();
      const list = tierEnemies(tierSel);
      const firstNew = list.findIndex(e => Gm.enemyUnlocked(e) && !S.p.defeated[e.name]);
      eSel = params && params.enemy ? Math.max(0, list.findIndex(e => e.name === params.enemy)) : Math.max(0, firstNew);
      if (S.p.pendingLevels.length) App.levelUps();
    },
    draw() {
      const w = G.w, h = G.h;
      let y = App.header('arena', '', 64, { state: { tier: tierSel }, live: { cheer: 0.2 } });
      F.big('THE ARENA', w >> 1, App.HUD_H + 22, { scale: 2, ramp: 'gold', align: 'center' });

      const locked = [1, 2, 3, 4].map(t => !Gm.tierUnlocked(t));
      const nt = UI.tabs('tiers', 4, y + 2, w - 8, 20, D.TIERS.map(t => 'RING ' + t.short), tierSel - 1, { locked });
      if (nt !== tierSel - 1) { tierSel = nt + 1; eSel = 0; App.sfx('tap'); }
      y += 25;
      const tier = D.TIERS[tierSel - 1];
      F.draw(tier.name, 8, y + 2, P.c.gold, { shadow: true });
      const done = Gm.defeatedIn(tierSel);
      F.draw(`${done}/5 beaten`, w - 8, y + 2, done >= D.TIER_UNLOCK ? P.c.green : P.c.dim, { align: 'right', shadow: true });
      y += 12;
      y += F.drawWrapped(tier.blurb, 8, y, w - 16, P.c.dim) + 2;

      // enemy rows
      const list = tierEnemies(tierSel);
      const rowH = 30;
      UI.panel(4, y, w - 8, rowH * 5 + 4, 'dark');
      list.forEach((e, i) => {
        const ry = y + 2 + i * rowH;
        const open = Gm.enemyUnlocked(e);
        const seen = open || S.p.defeated[e.name];
        if (UI.tap('en-' + i, 5, ry, w - 10, rowH - 1)) { eSel = i; App.sfx('tap'); }
        if (i === eSel) { G.rect(6, ry, w - 12, rowH - 1, '#334'); G.frame(6, ry, w - 12, rowH - 1, '#c92'); }
        G.rect(9, ry + 2, 26, 26, '#000');
        const por = A.enemyPortrait(e.name);
        G.blit(por, 10, ry + 3, seen ? undefined : { flash: '#223' });
        if (!open) G.blit(A.icon('ui_lock'), 23, ry + 17);
        F.draw(seen ? e.name : '? ? ?', 40, ry + 5, open ? P.c.bright : '#667', { shadow: true });
        F.draw(seen ? KIND[e.kind] + (e.special !== 'none' ? ' · ' + e.special : '') : 'Locked', 40, ry + 16, '#778');
        const kills = S.p.defeated[e.name] || 0;
        if (S.quest && S.quest.enemy === e.name) F.draw('OATH', w - 10, ry + 5, P.c.gold, { align: 'right', shadow: true });
        else if (kills) F.draw('★'.repeat(Math.min(3, kills)), w - 10, ry + 5, P.c.gold, { align: 'right', shadow: true });
        else if (open) F.draw('NEW', w - 10, ry + 5, P.c.green, { align: 'right', shadow: true });
        if (open && seen) { const [dn, dc] = App.danger(e); F.draw(dn, w - 10, ry + 16, dc, { align: 'right' }); }
      });
      y += rowH * 5 + 8;

      // detail
      const e = list[eSel];
      const open = Gm.enemyUnlocked(e);
      const detH = h - y - 4;
      UI.panel(4, y, w - 8, detH, 'stone');
      let cy = y + 7;
      if (!open) {
        const need = !Gm.tierUnlocked(e.tier)
          ? `Defeat ${D.TIER_UNLOCK} foes in ${D.TIERS[e.tier - 2].name} to open this ring.`
          : 'Defeat the other four champions of the Crown to face the dragon.';
        F.draw('Locked', 10, cy, P.c.red, { shadow: true });
        F.drawWrapped(need, 10, cy + 12, w - 20, P.c.text, { shadow: true });
        return App.drawHud();
      }
      F.draw(e.name, 10, cy, P.c.gold, { shadow: true });
      const [dn, dc] = App.danger(e);
      F.draw(dn, w - 10, cy, dc, { align: 'right', shadow: true });
      cy += 12;
      const stats = [['ui_hp', e.hp], ['ui_atk', `${e.damage_min}-${e.damage_max}`], ['ui_def', e.armor], ['ui_spd', e.speed]];
      let sx = 10;
      for (const [ic, v] of stats) {
        G.blit(A.icon(ic), sx, cy);
        F.draw(String(v), sx + 10, cy, P.c.text, { shadow: true });
        sx += 16 + F.measure(String(v)) + 6;
      }
      F.draw(`${U.fmt(e.xp)} xp · ${U.fmt(e.gold)}g`, w - 10, cy, P.c.dim, { align: 'right' });
      cy += 12;
      if (SPECIAL[e.special]) { F.draw(SPECIAL[e.special], 10, cy, P.c.text, { shadow: true }); cy += 11; }
      const moves = [];
      if (e.moves.feint) moves.push('{orange}feints');
      if (e.moves.combo) moves.push('{orange}strikes twice');
      const descLines = F.wrap(e.description + (moves.length ? '  It ' + moves.join('{/} and ') + '{/}.' : ''), w - 20);
      const room = Math.max(1, Math.floor((y + detH - 32 - cy) / 10));
      descLines.slice(0, room).forEach((ln, i) => F.draw(ln, 10, cy + i * 10, P.c.dim));
      cy += Math.min(room, descLines.length) * 10 + 4;
      // a live look at the foe when the screen is tall enough
      const boxH = y + detH - 32 - cy;
      if (boxH >= 60) {
        const bx = 9, bw = w - 18;
        G.rect(bx - 1, cy - 1, bw + 2, boxH + 2, '#000');
        G.clip(bx, cy, bw, boxH, () => {
          A.drawScene('arena', bx, cy, bw, boxH, App.t, { tier: e.tier }, { cheer: 0.1 });
          const img = A.enemyFrame(e.name, { f: Math.floor(App.t * 4) });
          const d = A.enemyDef(e.name) || { w: img.width, h: img.height, anchor: [img.width >> 1, img.height - 1] };
          const feet = cy + boxH - 8;
          G.dither((w >> 1) - Math.floor(d.w / 3), feet - 2, Math.floor(d.w * 2 / 3), 4, null, '#000', 9);
          G.blit(img, (w >> 1) - d.anchor[0], feet - d.anchor[1]);
        });
      }
      if (UI.button('fight', 10, y + detH - 28, w - 20, 22, 'FIGHT!', { theme: 'red', key: 'Enter', sound: false })) {
        App.sfx('roar');
        App.go('combat', { enemy: e.name, streak: 0 });
      }
      App.drawHud();
    },
  });

  // ---------------------------------------------------------------
  // HERO
  // ---------------------------------------------------------------
  let heroTab = 0;
  const statRow = (x, y, w, icon, label, value, col) => {
    if (icon) G.blit(A.icon(icon), x, y);
    F.draw(label, x + (icon ? 11 : 0), y, P.c.dim);
    F.draw(String(value), x + w, y, col || P.c.bright, { align: 'right', shadow: true });
  };

  App.register('hero', {
    enter() { App.music('town'); if (S.p.pendingLevels.length) App.levelUps(); },
    draw() {
      const w = G.w, h = G.h, p = S.p;
      G.blit(G.cache(`herobg|${w}x${h}`, w, h - App.HUD_H, (cx, cw, ch) => G.copper(0, 0, cw, ch, ['#112', '#102', '#101'], cx, 6)), 0, App.HUD_H);
      let y = App.HUD_H + 4;
      if (UI.button('hero-back', 4, y, 34, 20, '◀', { key: 'Escape', sound: 'back' })) App.go('town');
      heroTab = UI.tabs('herotabs', 42, y, w - 46, 20, ['STATS', 'SKILLS', 'BESTIARY'], heroTab);
      y += 26;
      if (heroTab === 0) drawStats(y);
      else if (heroTab === 1) drawSkills(y);
      else drawBestiary(y);
      App.drawHud();
    },
  });

  function drawStats(y) {
    const w = G.w, h = G.h, p = S.p;
    // hero on a little arena pedestal
    const boxH = 82;
    UI.panel(4, y, w - 8, boxH, 'dark');
    G.clip(5, y + 1, w - 10, boxH - 2, () => {
      A.drawScene('arena', 5, y + 1, w - 10, boxH - 2, DW.app.t, { tier: Gm.highestTier() });
      const img = A.heroFrame({ act: 'idle', f: Math.floor(DW.app.t * 3) }, Gm.gear());
      G.blit(img, (w >> 1) - (img.width >> 1), y + boxH - img.height + 8);
    });
    F.draw(p.name, 10, y + 5, P.c.gold, { shadow: true });
    F.draw(`Level ${p.level}`, 10, y + 15, P.c.text, { shadow: true });
    F.draw(`XP ${U.fmt(p.xp)}/${U.fmt(Gm.xpNext())}`, w - 10, y + 5, P.c.blue, { align: 'right', shadow: true });
    y += boxH + 4;

    const colW = Math.floor((w - 8 - 12) / 2);
    UI.panel(4, y, w - 8, 76, 'stone');
    const [a0, a1] = Gm.attackRange();
    let ly = y + 7;
    const L = 10, R = 10 + colW + 6;
    statRow(L, ly, colW - 4, 'ui_hp', 'HP', `${p.hp}/${p.maxHp}`, P.c.green);
    statRow(R, ly, colW - 4, 'ui_mp', 'MP', `${p.mp}/${p.maxMp}`, P.c.purple); ly += 11;
    statRow(L, ly, colW - 4, 'ui_atk', 'Attack', `${a0}-${a1}`);
    statRow(R, ly, colW - 4, 'ui_def', 'Defense', Gm.defense()); ly += 11;
    statRow(L, ly, colW - 4, 'ui_spd', 'Speed', Gm.speed());
    statRow(R, ly, colW - 4, 'ui_xp', 'Crit', Math.round(Gm.critChance() * 100) + '%'); ly += 11;
    statRow(L, ly, colW - 4, null, 'Strength', p.str);
    statRow(R, ly, colW - 4, null, 'Dexterity', p.dex); ly += 11;
    statRow(L, ly, colW - 4, null, 'Constitution', p.con);
    statRow(R, ly, colW - 4, null, 'Gold', U.fmt(p.gold), P.c.gold); ly += 11;
    F.draw('STR: damage · DEX: speed, defense, crit · CON: health', w >> 1, ly + 1, '#667', { align: 'center' });
    y += 80;

    // gear & pack
    const gearH = h - y - 4;
    UI.panel(4, y, w - 8, gearH, 'dark');
    let gy = y + 4;
    const wp = Gm.weaponData();
    const gearRow = (icon, name, line) => {
      G.rect(8, gy, 18, 18, '#000');
      G.blit(A.icon(icon), 10, gy + 2);
      F.draw(name, 30, gy, P.c.bright, { shadow: true });
      F.draw(line, 30, gy + 9, P.c.dim);
      gy += 21;
    };
    gearRow('w_' + wp.look, wp.name, `${wp.damage_min}-${wp.damage_max} dmg · SPD ${wp.speed >= 0 ? '+' : ''}${wp.speed}`);
    const ar = Gm.armorData(), rg = Gm.ringData();
    gearRow(ar ? ar.icon : 'a_leather', ar ? ar.name : 'No armour', ar ? `+${ar.value} defense` : 'Buy some at the Apothecary');
    if (rg) gearRow(rg.icon, rg.name, `+${rg.value} defense`);
    const pack = [];
    for (const [n, c] of Object.entries(p.potions)) pack.push([Gm.itemData(n).icon, c]);
    for (const [n, c] of Object.entries(p.wands)) pack.push([Gm.itemData(n).icon, c]);
    if (pack.length && gy + 20 < y + gearH) {
      F.draw('Pack:', 10, gy + 4, P.c.dim);
      let px = 40;
      for (const [ic, c] of pack) { G.blit(A.icon(ic), px, gy + 1); F.draw('×' + c, px + 15, gy + 4, P.c.text); px += 34; }
      gy += 20;
    }
    if (S.quest && gy + 12 < y + gearH) F.draw(`Oath: slay the {red}${S.quest.enemy}{/} for {gold}${S.quest.reward}g`, 10, gy + 2, P.c.text);
  }

  function drawSkills(y) {
    const w = G.w, h = G.h, p = S.p;
    // equipped slots
    F.draw(`Equipped (${p.slots.length}/${D.SLOTS}) — tap a skill to equip or remove it`, w >> 1, y, P.c.dim, { align: 'center' });
    y += 11;
    const sw = Math.floor((w - 8 - 8) / 3);
    for (let i = 0; i < D.SLOTS; i++) {
      const sx = 4 + i * (sw + 4);
      UI.panel(sx, y, sw, 30, i < p.slots.length ? 'gold' : 'dark');
      const id = p.slots[i];
      if (id) {
        const a = Gm.abilityData(id);
        G.blit(A.icon(a.icon), sx + 6, y + 8);
        const nm = Gm.abilityName(id);
        F.draw(F.measure(nm) > sw - 26 ? a.name.split(' ')[0] : nm, sx + 23, y + 7, P.c.bright, { shadow: true });
        F.draw(Gm.abilityCost(id) + ' MP', sx + 23, y + 17, P.c.purple);
      } else F.draw('empty', sx + sw / 2, y + 11, '#556', { align: 'center' });
    }
    y += 34;
    const rowH = 31;
    const listH = h - y - 4;
    UI.panel(4, y, w - 8, listH, 'dark');
    UI.scroll('skills', 5, y + 1, w - 10, listH - 2, D.ABILITIES.length * rowH + 2, oy => {
      D.ABILITIES.forEach((a, i) => {
        const ry = oy + 1 + i * rowH;
        const r = Gm.rank(a.id);
        const eq = p.slots.includes(a.id);
        const lvl = Object.keys(D.LEVEL_ABILITIES).find(k => D.LEVEL_ABILITIES[k] === a.id);
        if (r && UI.tap('sk-' + a.id, 5, ry, w - 14, rowH - 1)) {
          const res = Gm.toggleSlot(a.id);
          if (res === 'full') {
            App.dialog('SKILL SLOTS FULL', `Replace which skill with ${Gm.abilityName(a.id)}?`, p.slots.map((sid, si) => ({
              label: Gm.abilityName(sid), theme: 'purple', onTap: () => { Gm.replaceSlot(si, a.id); App.save(); App.sfx('equip'); },
            })).concat([{ label: 'CANCEL', key: 'Escape', sound: 'back' }]));
          } else { App.sfx(res === 'added' ? 'equip' : 'back'); App.save(); }
        }
        if (eq) G.rect(6, ry, w - 16, rowH - 1, '#213');
        G.hline(8, w - 12, ry + rowH - 1, '#223');
        G.rect(9, ry + 5, 18, 18, '#000');
        G.blit(A.icon(a.icon), 11, ry + 7, r ? undefined : { flash: '#334' });
        if (r) {
          F.draw(Gm.abilityName(a.id), 32, ry + 3, eq ? P.c.gold : P.c.bright, { shadow: true });
          F.draw('●'.repeat(r) + '○'.repeat(5 - r), w - 12, ry + 3, P.c.purple, { align: 'right' });
          F.draw(a.ranks[r - 1], 32, ry + 13, P.c.text);
          F.draw(`${Gm.abilityCost(a.id)} MP${r < 5 ? ' · next: ' + a.ranks[r] : ''}`, 32, ry + 22, '#778');
        } else {
          F.draw(a.name, 32, ry + 3, '#667', { shadow: true });
          F.draw(`Learned at level ${lvl}`, 32, ry + 13, '#556');
          F.draw(a.desc, 32, ry + 22, '#445');
        }
      });
    });
  }

  function drawBestiary(y) {
    const w = G.w, h = G.h, p = S.p;
    F.draw(`${Gm.totalDefeated()} of ${D.ENEMIES.length} creatures slain`, w >> 1, y, P.c.gold, { align: 'center', shadow: true });
    y += 12;
    const cols = 4, cw = Math.floor((w - 8) / cols), ch = 46;
    D.ENEMIES.forEach((e, i) => {
      const cx = 4 + (i % cols) * cw, cy = y + Math.floor(i / cols) * ch;
      const kills = p.defeated[e.name] || 0;
      if (UI.tap('best-' + i, cx, cy, cw - 2, ch - 2)) {
        App.sfx('tap');
        if (kills) App.message(e.name.toUpperCase(), `${e.description}\n\n{dim}${KIND[e.kind]} · HP ${e.hp} · DMG ${e.damage_min}-${e.damage_max} · ARM ${e.armor} · SPD ${e.speed}\n{gold}Defeated ${kills} time${kills > 1 ? 's' : ''}.`, null, { icon: A.enemyPortrait(e.name) });
        else App.message('UNKNOWN', 'You have not defeated this creature yet.', null);
      }
      UI.panel(cx, cy, cw - 2, ch - 2, 'dark');
      G.blit(A.enemyPortrait(e.name), cx + Math.floor((cw - 2 - 24) / 2), cy + 4, kills ? undefined : { flash: '#223' });
      const nm = kills ? e.name : '???';
      F.draw(F.measure(nm) > cw - 6 ? nm.split(' ')[0] : nm, cx + Math.floor((cw - 2) / 2), cy + 31, kills ? P.c.text : '#556', { align: 'center' });
      if (kills) F.draw('★', cx + cw - 9, cy + 3, P.c.gold);
    });
  }
})();

</script>
<script>
// ---- 35_combat_screen.js ----
// ================================================================
// COMBAT SCREEN — the arena stage, over-the-shoulder hero, the
// wind-up / block / parry loop and all the juice.
//
// Flow:  intro → next ─┬→ player (choose an action) → play events → next
//                      ├→ windup (block pad; read the tell) → strike → next
//                      └→ over → result dialog
// ================================================================
(() => {
  const G = DW.gfx, F = DW.font, UI = DW.ui, A = DW.art, FX = DW.fx, U = DW.util, P = DW.pal;
  const Gm = DW.game, S = DW.state, D = DW.data, App = DW.app, C = DW.combat;

  const EVENT_TIME = {
    log: 0, pAttack: 0.2, eDamage: 0.24, pDamage: 0.4, heal: 0.3, mp: 0.15, cast: 0.45, enemyRise: 0.9,
    enemyDie: 1.1, playerDie: 1.2, stun: 0.5, regen: 0.3, drain: 0.35, status: 0.35, counter: 0.12,
    flee: 0.5, drink: 0.2, parry: 0, block: 0, vanish: 0.7,
  };

  let st;   // per-fight screen state
  const L = {};   // layout

  function layout() {
    L.w = G.w; L.h = G.h;
    L.plateH = 34;
    L.actH = 70; L.logH = 34; L.barH = 24;
    L.bottomH = L.barH + L.logH + L.actH;
    L.stageY = L.plateH;
    L.stageH = L.h - L.plateH - L.bottomH;
    L.stageB = L.stageY + L.stageH;
    L.barY = L.stageB;
    L.logY = L.barY + L.barH;
    L.actY = L.logY + L.logH;
    L.enemyFeetY = L.stageB - 62;
    L.heroY = L.stageB + 12;
  }

  // ---------------------------------------------------------------
  // Positions of things on the stage
  // ---------------------------------------------------------------
  const enemyDef = () => A.enemyDef(st.enemy.name) || { w: 64, h: 64, anchor: [32, 63], center: [32, 32] };
  const enemyOrigin = () => {
    const d = enemyDef();
    let x = (L.w >> 1) - d.anchor[0], y = L.enemyFeetY - d.anchor[1];
    if (st.pose.wind) x += st.pose.dir * Math.round(3 * st.pose.wind);
    if (st.strikeT > 0) y += 6;
    if (st.hurtT > 0) y -= 2;
    if (st.dying) y += Math.round(st.dieT * 8);
    if (st.introT < 0.5) y -= Math.round((0.5 - st.introT) * 30);
    return [x, y];
  };
  const enemyCenter = () => {
    const d = enemyDef(), [x, y] = enemyOrigin();
    const c = d.center || [d.w >> 1, d.h >> 1];
    return [x + c[0], y + c[1]];
  };
  const enemySide = dir => {
    const d = enemyDef(), [x, y] = enemyOrigin();
    return [x + (d.w >> 1) + dir * Math.round(d.w * 0.42), y + Math.round(d.h * (dir === 0 ? 0.05 : 0.3))];
  };
  const heroCenter = () => [L.w >> 1, L.stageB - 34];
  const shieldPos = dir => [(L.w >> 1) + (dir === 1 ? 14 : dir === 0 ? -6 : -26), L.stageB - (dir === 0 ? 58 : 40)];

  // ---------------------------------------------------------------
  // Enter
  // ---------------------------------------------------------------
  App.register('combat', {
    enter(params) {
      layout();
      FX.clear();
      const c = C.start(params.enemy, params.streak || 0);
      st = {
        c, enemy: c.enemy, phase: 'intro', introT: 0, t: 0,
        queue: [], wait: 0, log: [],
        pose: { f: 0, dir: 0, wind: 0, strike: 0, hurt: 0 },
        hero: { act: 'idle', t: 0, dir: 0 }, heroT: 0,
        strikeT: 0, hurtT: 0, flashT: 0, dieT: 0, dying: false, heroDying: 0,
        windup: null, guard: null, guardAt: 0, wt: 0, glinted: false, feinted: false,
        menu: null, cheer: 0.3, hpGhost: c.ehp, pGhost: S.p.hp, result: null, vanishing: 0,
        banner: { text: c.streak ? 'REMATCH!' : 'VS', sub: c.enemy.name.toUpperCase(), t: 0 },
      };
      pullEvents();
      App.music(c.enemy.tier >= 4 ? 'boss' : 'battle');
      App.sfx(c.enemy.tier >= 3 ? 'roar' : 'screech');
    },
    exit() { FX.clear(); },
    draw(dt, t) {
      if (G.w !== L.w || G.h !== L.h) layout();
      update(dt);
      render(t);
    },
  });

  // ---------------------------------------------------------------
  // Events → animation queue
  // ---------------------------------------------------------------
  function pullEvents() {
    const c = st.c;
    while (c.events.length) st.queue.push(c.events.shift());
  }

  function addLog(text, col) {
    st.log.push({ text, col: P.c[col] || col || P.c.text });
    if (st.log.length > 30) st.log.shift();
  }

  function playEvent(e) {
    const [ex, ey] = enemyCenter();
    const [hx, hy] = heroCenter();
    switch (e.t) {
      case 'fn': e.fn(); return 0;
      case 'log': addLog(e.text, e.col); break;
      case 'pAttack':
        st.hero = { act: 'attack', t: 0, dir: 0 }; st.heroT = e.quick ? 0.16 : 0.26;
        App.sfx('whoosh', { pitch: 1.3, vol: 0.5 });
        break;
      case 'counter':
        st.hero = { act: 'attack', t: 0, dir: 0 }; st.heroT = 0.18;
        FX.glint(shieldPos(st.guard === null ? 0 : st.guard)[0], shieldPos(0)[1], 8);
        break;
      case 'eDamage': {
        const big = e.crit || e.dmg >= st.c.emax * 0.2;
        if (e.src === 'melee' || e.src === 'counter') FX.slash(ex, ey, Math.random() < 0.5 ? 1 : -1, e.crit ? '#fd5' : '#fff', e.crit ? 30 : 24);
        if (e.src === 'burn') FX.embers(ex, ey, 10);
        else if (e.src === 'frost' || e.src === 'ice') FX.frost(ex, ey, 10);
        else if (e.src === 'lightning') FX.sparks(ex, ey, 18);
        else if (e.src === 'fire') { FX.embers(ex, ey, 24); FX.burst(ex, ey, { n: 18, cols: ['#fd5', '#fa2', '#e70'], speed: 90, grav: 60 }); }
        else FX.sparks(ex, ey, e.crit ? 20 : 10);
        FX.number(ex + U.rand(-8, 8), ey - 10, (e.crit ? e.dmg + '!' : e.dmg), e.crit ? '#fd5' : '#fff', { big: e.crit });
        st.hurtT = 0.22; st.flashT = 0.08;
        FX.stop(e.crit ? 0.09 : 0.045);
        if (e.crit) { FX.shake(4, 0.25); FX.flash('#fff', 0.1); }
        else FX.shake(1.5, 0.12);
        App.sfx(e.src === 'fire' || e.src === 'burn' ? 'fire' : e.src === 'ice' || e.src === 'frost' ? 'ice' : e.src === 'lightning' ? 'zap' : e.crit ? 'crit' : 'hit');
        st.cheer = Math.min(1, st.cheer + (big ? 0.6 : 0.25));
        break;
      }
      case 'pDamage': {
        const dir = e.dir;
        if (e.parried) {
          st.hero = { act: 'block', t: 0, dir }; st.heroT = 0.4;
          const [sx, sy] = shieldPos(dir);
          FX.glint(sx, sy, 12, '#fff', 0.4); FX.ring(sx, sy, '#fd5', 34, 0.4); FX.sparks(sx, sy, 22);
          FX.number(sx, sy - 14, 'PARRY!', '#fd5', { big: true, life: 1.1 });
          FX.slow(0.35); FX.flash('#fd5', 0.12);
          App.sfx('parry'); UI.buzz(15);
          st.cheer = 1;
        } else if (e.blocked) {
          st.hero = { act: 'block', t: 0, dir }; st.heroT = 0.35;
          const [sx, sy] = shieldPos(dir);
          FX.sparks(sx, sy, 12); FX.shake(2, 0.15);
          FX.number(hx, hy - 30, e.dmg, '#bcd');
          App.sfx('block'); UI.buzz(20);
        } else {
          st.hero = { act: 'hurt', t: 0, dir: 0 }; st.heroT = 0.4;
          if (e.breath) { FX.embers(hx, hy - 20, 30); FX.flash('#fa2', 0.2); }
          FX.blood(hx, hy - 20, 10);
          FX.number(hx + U.rand(-10, 10), hy - 34, e.dmg, '#f65', { big: e.dmg >= S.p.maxHp * 0.2 });
          FX.shake(e.dmg >= S.p.maxHp * 0.2 ? 6 : 4, 0.3); FX.flash('#d33', 0.15); FX.stop(0.06);
          App.sfx('hurt'); UI.buzz(45);
          st.cheer = Math.min(1, st.cheer + 0.4);
        }
        break;
      }
      case 'heal': FX.heal(hx, hy - 10, 20); FX.number(hx, hy - 36, '+' + e.amount, '#9d7'); App.sfx('heal'); FX.pillar(hx, L.stageB, '#9c7', 70); break;
      case 'mp': FX.magic(hx, hy - 10, 14, ['#bef', '#8de', '#5ac']); FX.number(hx, hy - 36, '+' + e.amount + ' MP', '#8de'); App.sfx('magic'); break;
      case 'drink': App.sfx('drink'); break;
      case 'regen': FX.heal(ex, ey, 10); FX.number(ex, ey - 16, '+' + e.amount, '#9d7'); break;
      case 'drain': FX.magic(hx, hy - 10, 16, ['#dbf', '#b8e', '#74a']); FX.number(hx, hy - 30, '-' + e.amount + ' XP', '#c9f'); App.sfx('magic', { pitch: 0.6 }); break;
      case 'stun':
        if (e.who === 'enemy') { FX.number(ex, ey - 24, 'STUNNED', '#fd5'); FX.ring(ex, ey, '#fd5', 20); }
        else { FX.number(hx, hy - 34, 'PETRIFIED', '#bbc'); }
        App.sfx('stun');
        break;
      case 'status':
        if (e.type === 'exhaust') FX.number(hx, hy - 34, 'EXHAUSTED', '#f65');
        if (e.type === 'petrify') { FX.number(hx, hy - 34, 'STONE!', '#bbc'); FX.flash('#889', 0.2); }
        break;
      case 'cast': return castFx(e.id);
      case 'enemyRise':
        FX.flash('#d33', 0.25); FX.shake(5, 0.4); FX.number(L.w >> 1, L.stageY + 30, 'RISES AGAIN!', '#f65', { big: true, life: 1.4 });
        App.sfx('roar'); st.hpGhost = st.c.ehp;
        break;
      case 'enemyDie':
        st.dying = true; st.dieT = 0; st.flashT = 0.6;
        FX.shake(5, 0.4); FX.stop(0.12); FX.flash('#fff', 0.15);
        FX.dust(L.w >> 1, L.enemyFeetY, 24); FX.sparks(ex, ey, 24);
        App.sfx(st.enemy.tier >= 3 ? 'roar' : 'screech', { pitch: 0.7 });
        st.cheer = 1;
        break;
      case 'playerDie':
        st.heroDying = 0.001; FX.flash('#d33', 0.5); FX.shake(6, 0.5);
        App.sfx('defeat');
        break;
      case 'flee':
        if (e.ok) { st.vanishing = 0.001; App.sfx('flee'); }
        else { FX.number(hx, hy - 34, 'CUT OFF!', '#f65'); App.sfx('deny'); }
        break;
      case 'vanish':
        st.vanishing = 0.001; FX.magic(hx, hy - 10, 30, ['#334', '#445', '#74a', '#000']); App.sfx('magic', { pitch: 0.5 });
        break;
    }
    return EVENT_TIME[e.t] || 0;
  }

  // Returns how long the cast takes before the next event plays.
  function castFx(id) {
    const [ex, ey] = enemyCenter();
    const [hx, hy] = heroCenter();
    if (id === 'double_slash') { App.sfx('whoosh'); return 0.08; }
    st.hero = { act: 'cast', t: 0, dir: 0 }; st.heroT = 0.45;
    FX.magic(hx, hy - 30, 10);
    switch (id) {
      case 'fireball': case 'wand_fire': FX.bolt(hx, hy - 40, ex, ey, 'fire', () => { FX.flash('#fa2', 0.12); FX.shake(3, 0.2); }); App.sfx('fire'); break;
      case 'wand_lightning': FX.bolt(hx, hy - 40, ex, ey, 'lightning'); FX.flash('#eff', 0.1); App.sfx('zap'); break;
      case 'icy_rain': FX.icefall(ex, ey, 46); App.sfx('ice'); break;
      case 'shatter': FX.ring(ex, ey, '#fd5', 34); FX.sparks(ex, ey, 16); App.sfx('crit'); break;
      case 'ultra_strength': FX.flash('#d33', 0.15); FX.burst(hx, hy - 20, { n: 26, cols: ['#f65', '#d33', '#fa2'], speed: 70, grav: -40 }); App.sfx('roar', { pitch: 1.6 }); break;
      case 'speed_warrior': FX.burst(hx, hy - 20, { n: 22, cols: ['#eff', '#8de'], speed: 120, grav: 0, angle: Math.PI, spread: 0.6 }); App.sfx('whoosh'); break;
      case 'rallying_cry': FX.pillar(hx, L.stageB, '#fd5', 90); App.sfx('levelup', { vol: 0.6 }); break;
      case 'riposte': FX.glint(shieldPos(0)[0], shieldPos(0)[1], 10); App.sfx('parry', { vol: 0.5 }); break;
      case 'vanish': break;
    }
    return EVENT_TIME.cast;
  }

  // ---------------------------------------------------------------
  // Update (state machine)
  // ---------------------------------------------------------------
  function update(dt) {
    const c = st.c;
    st.t += dt;
    st.cheer = Math.max(0.15, st.cheer - dt * 0.5);
    if (st.strikeT > 0) st.strikeT -= dt;
    if (st.hurtT > 0) st.hurtT -= dt;
    if (st.flashT > 0) st.flashT -= dt;
    if (st.dying) st.dieT = Math.min(1, st.dieT + dt * 1.1);
    if (st.heroDying) st.heroDying = Math.min(1, st.heroDying + dt);
    if (st.vanishing) st.vanishing = Math.min(1, st.vanishing + dt * 1.6);
    if (st.heroT > 0) {
      st.heroT -= dt;
      if (st.hero.act === 'attack') st.hero.t = st.heroT > 0.14 ? 0 : st.heroT > 0.06 ? 1 : 2;
      if (st.hero.act === 'attack' && st.hero.t === 1 && !st.hero.swung) { st.hero.swung = true; }
      if (st.heroT <= 0 && st.phase !== 'windup') st.hero = { act: 'idle', t: 0, dir: 0 };
    }
    st.hpGhost = U.lerp(st.hpGhost, c.ehp, Math.min(1, dt * 3));
    st.pGhost = U.lerp(st.pGhost, S.p.hp, Math.min(1, dt * 3));
    if (st.banner) { st.banner.t += dt; if (st.banner.t > 1.4) st.banner = null; }

    // play queued events
    if (st.wait > 0) { st.wait -= dt; return; }
    while (st.queue.length && st.wait <= 0) st.wait = playEvent(st.queue.shift());
    if (st.wait > 0 || st.queue.length) return;

    switch (st.phase) {
      case 'intro':
        st.introT += dt;
        if (st.introT > 1.0) { st.phase = 'next'; }
        break;
      case 'next': {
        if (c.over) { st.phase = 'ending'; st.endT = 0; break; }
        const r = C.next();
        pullEvents();
        if (r.type === 'player') { st.phase = 'player'; st.menu = null; }
        else if (r.type === 'enemy') beginWindup(r.attack);
        else if (r.type === 'over') { st.phase = 'ending'; st.endT = 0; }
        else st.wait = 0.25;   // skipped turn: breathe, then continue
        break;
      }
      case 'player': break;   // waiting for a tap
      case 'windup': updateWindup(dt); break;
      case 'after':
        st.afterT -= dt;
        if (st.afterT <= 0) st.phase = 'next';
        break;
      case 'ending':
        st.endT += dt;
        if (st.endT > 0.5 && !st.result) showResult();
        break;
    }
  }

  function beginWindup(a) {
    st.phase = 'windup';
    st.windup = a; st.wt = 0;
    st.guard = null; st.guardAt = 0; st.glinted = false; st.feinted = false;
    st.pose = { f: 0, dir: a.dir, wind: 0.01, strike: 0, hurt: 0 };
    st.hero = { act: 'idle', t: 0, dir: 0 };
    App.sfx('whoosh', { pitch: 0.7, vol: 0.4 });
  }

  function setGuard(dir) {
    if (st.phase !== 'windup' || !st.windup) return;
    st.guard = dir; st.guardAt = st.wt;
    st.hero = { act: 'block', t: 0, dir }; st.heroT = 9;
    App.sfx('step', { pitch: 1.2, vol: 0.4 });
  }

  function updateWindup(dt) {
    const a = st.windup;
    st.wt += dt * 1000;
    const dir = a.feintAt && st.wt >= a.feintAt ? a.feintDir : a.dir;
    if (a.feintAt && !st.feinted && st.wt >= a.feintAt) { st.feinted = true; App.sfx('whoosh', { pitch: 0.9, vol: 0.5 }); }
    st.pose.dir = dir;
    st.pose.wind = Math.min(1, st.wt / (a.windup * 0.6));
    const remain = a.windup - st.wt;
    if (!st.glinted && remain <= a.parry && !a.breath) {
      st.glinted = true;
      const [gx, gy] = enemySide(dir);
      FX.glint(gx, gy, 7, '#fff', 0.28);
    }
    if (a.breath && Math.random() < 0.5) {
      const d = enemyDef(), [ox, oy] = enemyOrigin();
      const m = d.mouth || [d.w >> 1, Math.round(d.h * 0.3)];
      FX.embers(ox + m[0], oy + m[1], 1);
    }
    if (st.wt >= a.windup) {
      const ms = st.guard === null ? 9999 : a.windup - st.guardAt;
      st.pose = { f: 0, dir, wind: 0, strike: 1, hurt: 0 };
      st.strikeT = 0.28;
      App.sfx(a.breath ? 'fire' : 'whoosh', { pitch: a.breath ? 0.8 : 1.6 });
      const r = C.resolveAttack(st.guard, ms);
      pullEvents();
      if (r.combo && !st.c.over) {
        st.wait = 0.3;
        setTimeout0(() => beginWindup(r.combo));
      } else {
        st.phase = 'after'; st.afterT = 0.35;
        st.windup = null;
      }
    }
  }
  // run after the current queue drains (keeps ordering with events)
  function setTimeout0(fn) { st.queue.push({ t: 'fn', fn }); }

  // ---------------------------------------------------------------
  // Player input
  // ---------------------------------------------------------------
  function doAct(kind, arg) {
    if (st.phase !== 'player') return;
    if (!C.act(kind, arg)) { App.sfx('deny'); return; }
    st.menu = null;
    pullEvents();
    st.phase = 'after'; st.afterT = 0.3;
  }

  // ---------------------------------------------------------------
  // Result
  // ---------------------------------------------------------------
  function showResult() {
    const sum = C.finish();
    st.result = sum;
    const e = st.enemy;
    if (sum.result === 'win') {
      App.sfx('victory');
      App.music(null);
      const lines = [`{blue}+${U.fmt(sum.xp)} XP{/}    {gold}+${U.fmt(sum.gold)} gold`];
      if (sum.streak) lines.push(`{orange}Rematch ×${sum.streak}: gold ×${Math.pow(1.5, sum.streak).toFixed(2)}`);
      if (sum.questGold) lines.push(`{gold}Oath fulfilled: +${sum.questGold} gold`);
      if (sum.levels.length) lines.push(`{gold}LEVEL UP! You are now level ${S.p.level}.`);
      const after = dest => App.levelUps(() => dest());
      const buttons = [];
      if (sum.final) {
        buttons.push({ label: 'CLAIM YOUR TITLE', theme: 'gold', key: 'Enter', onTap: () => after(() => App.go('ending')) });
      } else {
        buttons.push({ label: 'FIGHT AGAIN', theme: 'red', onTap: () => after(() => App.go('combat', { enemy: e.name, streak: sum.streak + 1 })) });
        buttons.push({ label: 'BACK TO THE ARENA', theme: 'gold', key: 'Enter', onTap: () => after(() => App.go('arena', { tier: e.tier, enemy: e.name })) });
      }
      App.dialog(sum.final ? 'THE DRAGON FALLS' : 'VICTORY!', lines.join('\n') + (sum.final ? '' : `\n\n{dim}Fight again: it returns with ${sum.streak + 2} lives, but pays ×${Math.pow(1.5, sum.streak + 1).toFixed(2)} gold.`), buttons, { icon: A.enemyPortrait(e.name) });
    } else if (sum.result === 'lose') {
      App.music(null);
      const tip = (S.stats.losses >= 2 && !S.settings.assist) ? '\n\n{dim}Tip: turn on Block Assist in Options for slower wind-ups.' : '\n\n{dim}Watch which side it winds up from, and block that side.';
      App.dialog('DEFEATED', `You were dragged from the sand barely alive.\n{red}Lost ${U.fmt(sum.lostGold)} gold.${tip}`, [
        { label: 'LIMP BACK TO TOWN', theme: 'stone', key: 'Enter', onTap: () => App.go('town') },
      ]);
    } else {
      const gotGold = sum.gold ? `\n{gold}+${U.fmt(sum.gold)} gold` : '';
      const gotXp = sum.xp ? `  {blue}+${U.fmt(sum.xp)} XP` : '';
      App.dialog('ESCAPED', `You slip out of the arena with your life.${gotGold}${gotXp}`, [
        { label: 'BACK TO THE ARENA', theme: 'gold', key: 'Enter', onTap: () => App.levelUps(() => App.go('arena', { tier: st.enemy.tier, enemy: st.enemy.name })) },
      ]);
    }
  }

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function render(t) {
    const c = st.c, w = L.w;
    // stage
    A.drawScene('arena', 0, L.stageY, w, L.stageH, App.t, { tier: st.enemy.tier }, { cheer: st.cheer });
    G.clip(0, L.stageY, w, L.stageH, () => {
      drawEnemy();
      drawTell();
      drawHero();
      FX.draw();
      drawTurnStrip();
      if (st.banner) drawBanner();
    });
    drawEnemyPlate();
    drawPlayerBar();
    drawLog();
    drawActions();
  }

  function drawEnemy() {
    if (st.dieT >= 1) return;
    const [x, y] = enemyOrigin();
    const pose = Object.assign({}, st.pose);
    if (st.phase !== 'windup' && st.strikeT <= 0) { pose.wind = 0; pose.strike = 0; }
    if (st.strikeT <= 0) pose.strike = 0;
    pose.hurt = st.hurtT > 0 || st.dying ? 1 : 0;
    if (!pose.wind && !pose.strike && !pose.hurt) pose.f = Math.floor(App.t * 4) % 4;
    const img = A.enemyFrame(st.enemy.name, pose);
    const d = enemyDef();
    // shadow
    G.dither((L.w >> 1) - Math.floor(d.w / 3), L.enemyFeetY - 2, Math.floor(d.w * 2 / 3), 5, null, '#000', 9);
    let fade = 0;
    if (st.introT < 0.6) fade = Math.round((1 - st.introT / 0.6) * 16);
    if (st.dying) fade = Math.round(Math.max(0, st.dieT - 0.25) / 0.75 * 16);
    const flash = st.flashT > 0 && (Math.floor(st.flashT * 30) & 1) === 0 ? '#fff' : null;
    G.blit(img, x, y, { fade, flash });
  }

  // Extra readability for the tell: a pulsing chevron on the attacking side.
  function drawTell() {
    if (st.phase !== 'windup' || !st.windup) return;
    const dir = st.pose.dir;
    const [sx, sy] = enemySide(dir);
    const pulse = Math.floor(App.t * 10) & 1;
    const col = pulse ? '#f65' : '#fd5';
    const big = S.settings.assist;
    const glyph = dir < 0 ? '◀' : dir > 0 ? '▶' : '▲';
    const ox = dir < 0 ? -10 : dir > 0 ? 6 : -2, oy = dir === 0 ? -12 : 0;
    if (big) F.big(glyph, sx + ox, sy + oy - 4, { scale: 2, ramp: 'blood', align: 'center' });
    else F.draw(glyph, sx + ox, sy + oy, col, { outline: '#000' });
    // coaching for brand-new players: the first few attacks are spelled out
    if ((S.stats.blocks || 0) + (S.stats.parries || 0) < 3 && (S.stats.fights || 0) <= 3) {
      const side = dir < 0 ? 'LEFT: tap ◀' : dir > 0 ? 'RIGHT: tap ▶' : 'ABOVE: tap ▲';
      const txt = `It attacks from the ${side}`;
      const ty = L.stageY + 24;
      G.dither(0, ty - 3, L.w, 14, null, '#000', 11);
      F.draw(txt, L.w >> 1, ty, pulse ? '#fd5' : '#ffe', { align: 'center', shadow: true });
    }
  }

  function drawHero() {
    const pose = Object.assign({ f: Math.floor(App.t * 3) % 4 }, st.hero);
    const img = A.heroFrame(pose, Gm.gear());
    const def = A.hero || { w: 80, h: 72, anchor: [40, 71] };
    let x = (L.w >> 1) - def.anchor[0], y = L.heroY - def.anchor[1];
    if (st.hero.act === 'hurt') y += 2;
    if (st.hero.act === 'attack' && st.hero.t === 1) y -= 3;
    let fade = 0;
    if (st.heroDying) { fade = Math.round(st.heroDying * 12); y += Math.round(st.heroDying * 10); }
    if (st.vanishing) fade = Math.round(st.vanishing * 16);
    G.blit(img, x, y, { fade });
  }

  function drawTurnStrip() {
    if (st.c.over) return;
    const order = C.preview(6);
    let x = 4;
    const y = L.stageY + 4;
    G.dither(x - 2, y - 2, 6 * 14 + 30, 16, null, '#000', 9);
    F.draw('NEXT', x, y + 3, '#889', { shadow: true });
    x += 24;
    const por = A.enemyPortrait(st.enemy.name), hp = A.icon('hero_portrait');
    order.forEach((who, i) => {
      G.rect(x - 1, y - 1, 13, 13, i === 0 ? '#fd5' : '#000');
      const src = who === 'p' ? hp : por;
      G.ctx.drawImage(src, 6, 4, 11, 11, x, y, 11, 11);
      if (who === 'e') G.dither(x, y, 11, 11, null, '#d33', 3);
      x += 14;
    });
  }

  function drawBanner() {
    const b = st.banner;
    const f = b.t;
    if (f > 1.3) return;
    const y = L.stageY + Math.round(L.stageH * 0.3);
    const slide = f < 0.15 ? (0.15 - f) * 600 : f > 1.1 ? (f - 1.1) * -800 : 0;
    G.dither(0, y - 4, L.w, 34, null, '#000', 10);
    F.big(b.text, (L.w >> 1) + slide, y, { scale: 2, ramp: 'blood', align: 'center' });
    F.big(b.sub, (L.w >> 1) - slide, y + 16, { scale: 1, ramp: 'gold', align: 'center' });
  }

  function drawEnemyPlate() {
    const c = st.c, w = L.w;
    UI.panel(0, 0, w, L.plateH, 'stone');
    F.draw(st.enemy.name, 6, 5, P.c.gold, { shadow: true });
    // lives
    if (c.lives > 1) {
      let lx = 6 + F.measure(st.enemy.name) + 6;
      for (let i = 0; i < c.lives; i++) { F.draw('♥', lx, 5, i < c.livesLeft ? P.c.red : '#334', { shadow: true }); lx += 7; }
    }
    const armor = c.est.some(s => s.type === 'shatter') ? `{red}ARM ${Math.round(st.enemy.armor * (1 - c.est.find(s => s.type === 'shatter').armorPct))}` : `ARM ${st.enemy.armor}`;
    F.draw(`${armor}{/}  SPD ${C.enemySpeed(c)}`, w - 6, 5, P.c.dim, { align: 'right', shadow: true });
    UI.bar(5, 15, w - 10, 9, c.ehp / c.emax, 'blood', { ghost: st.hpGhost / c.emax, label: `${Math.max(0, c.ehp)}/${c.emax}` });
    App.statusIcons(C.statusList('enemy'), 6, 26);
  }

  function drawPlayerBar() {
    const p = S.p, w = L.w, y = L.barY;
    UI.panel(0, y, w, L.barH, 'stone');
    const bw = Math.floor((w - 14) / 2);
    const low = p.hp / p.maxHp < 0.3;
    UI.bar(5, y + 4, bw, 9, p.hp / p.maxHp, low ? 'blood' : 'green', { ghost: st.pGhost / p.maxHp, label: `HP ${p.hp}/${p.maxHp}`, pulse: low });
    UI.bar(9 + bw, y + 4, bw, 9, p.mp / Math.max(1, p.maxMp), 'arcane', { label: `MP ${p.mp}/${p.maxMp}` });
    const end = App.statusIcons(C.statusList('player'), 6, y + 15);
    F.draw(`SPD ${C.playerSpeed()}`, w - 6, y + 14, P.c.dim, { align: 'right' });
    if (st.c.pst.some(s => s.type === 'riposte')) F.draw('counter ready', end + 2, y + 14, P.c.gold);
  }

  function drawLog() {
    const w = L.w, y = L.logY;
    UI.panel(0, y, w, L.logH, 'dark');
    const lines = [];
    for (let i = st.log.length - 1; i >= 0 && lines.length < 3; i--) {
      const wr = F.wrap('{' + st.log[i].col + '}' + st.log[i].text, w - 12);
      for (let k = wr.length - 1; k >= 0 && lines.length < 3; k--) lines.unshift({ text: wr[k], age: st.log.length - 1 - i });
    }
    lines.forEach((ln, i) => F.draw(ln.text, 6, y + 4 + i * 10, P.c.text, { shadow: true }));
  }

  // ---------------------------------------------------------------
  // Actions / block pad / sub-menus
  // ---------------------------------------------------------------
  function drawActions() {
    const w = L.w, y = L.actY, h = L.h - L.actY;
    UI.panel(0, y, w, h, 'stone');
    if (st.phase === 'windup') return drawBlockPad(y, h);

    const ready = st.phase === 'player' && !st.queue.length && st.wait <= 0;
    const pad = 5, gap = 4;
    const bw = Math.floor((w - pad * 2 - gap) / 2), bh = Math.floor((h - pad * 2 - gap) / 2);

    if (st.menu) return drawMenu(y, h, ready);

    const p = S.p;
    const cheapest = p.slots.length ? Math.min(...p.slots.map(Gm.abilityCost)) : 99;
    const items = Object.values(p.potions).reduce((s, n) => s + n, 0) + Gm.wandCharges();
    if (UI.button('a-atk', pad, y + pad, bw, bh, 'ATTACK', { theme: 'red', icon: A.icon('ui_atk'), disabled: !ready, key: ['1', 'a'], sound: false })) doAct('attack');
    if (UI.button('a-skl', pad + bw + gap, y + pad, bw, bh, 'SKILLS', { theme: 'purple', icon: A.icon('m_skills'), disabled: !ready || !p.slots.length, sub: p.slots.length ? `from ${cheapest} MP` : 'none', key: ['2', 's'] })) st.menu = 'skills';
    if (UI.button('a-itm', pad, y + pad + bh + gap, bw, bh, 'ITEMS', { theme: 'green', icon: A.icon('m_bag'), disabled: !ready || !items, sub: items ? `${items} in pack` : 'empty', key: ['3', 'i'] })) st.menu = 'items';
    if (UI.button('a-fle', pad + bw + gap, y + pad + bh + gap, bw, bh, 'FLEE', { theme: 'stone', icon: A.icon('m_flee'), disabled: !ready, key: ['4', 'f'], sound: false })) doAct('flee');
  }

  function drawMenu(y, h, ready) {
    const w = L.w, p = S.p;
    const opts = [];
    if (st.menu === 'skills') {
      p.slots.forEach(id => {
        const a = Gm.abilityData(id), cost = Gm.abilityCost(id);
        opts.push({ id, label: Gm.abilityName(id), sub: `${cost} MP · ${a.ranks[Gm.rank(id) - 1]}`, icon: A.icon(a.icon), ok: p.mp >= cost, act: () => doAct('ability', id), theme: 'purple' });
      });
    } else {
      for (const [n, cnt] of Object.entries(p.potions)) {
        const it = Gm.itemData(n);
        const full = it.type === 'mana' ? p.mp >= p.maxMp : p.hp >= p.maxHp;
        opts.push({ id: n, label: `${n} ×${cnt}`, sub: full ? (it.type === 'mana' ? 'MP is full' : 'HP is full') : it.type === 'mana' ? `+${it.value} MP` : it.value >= 999 ? 'Full HP' : `+${it.value} HP`, icon: A.icon(it.icon), ok: !full, act: () => doAct('potion', n), theme: 'green' });
      }
      for (const [n, cnt] of Object.entries(p.wands)) {
        const it = Gm.itemData(n);
        opts.push({ id: n, label: `${n} (${cnt})`, sub: it.element === 'fire' ? 'Fire, ignores armour' : 'Lightning, may stun', icon: A.icon(it.icon), ok: true, act: () => doAct('wand', n), theme: 'blue' });
      }
    }
    // the menu grows upward over the log if needed
    const rowH = 26, n = opts.length;
    const mh = n * (rowH + 3) + 28;
    const my = L.h - mh - 4;
    UI.panel(2, my, w - 4, mh + 2, 'gold');
    opts.forEach((o, i) => {
      if (UI.button('m-' + o.id, 8, my + 6 + i * (rowH + 3), w - 16, rowH, o.label, { icon: o.icon, sub: o.sub, align: 'left', theme: o.ok ? o.theme : 'dark', disabled: !ready || !o.ok, key: String(i + 1), sound: false })) o.act();
    });
    if (UI.button('m-back', 8, my + mh - 22, w - 16, 18, 'BACK', { key: 'Escape', sound: 'back' })) st.menu = null;
  }

  function drawBlockPad(y, h) {
    const w = L.w, a = st.windup;
    // timer bar with the parry zone at the end
    const bx = 6, bw = w - 12, by = y + 4;
    const remain = Math.max(0, a.windup - st.wt);
    // time runs left → right; the parry zone waits at the right-hand end
    G.rect(bx, by, bw, 6, '#000');
    const inner = bw - 2;
    const pz = Math.round(inner * a.parry / a.windup);
    G.rect(bx + 1 + inner - pz, by + 1, pz, 4, a.breath ? '#334' : '#530');
    G.dither(bx + 1 + inner - pz, by + 1, pz, 4, null, a.breath ? '#556' : '#a70', 8);
    const fill = Math.round(inner * Math.min(1, st.wt / a.windup));
    G.rect(bx + 1, by + 1, fill, 4, remain <= a.parry && !a.breath ? '#fe6' : '#d33');
    G.rect(bx + fill, by, 1, 6, '#fff');
    F.draw(a.breath ? 'BREATH! block it — it cannot be parried' : remain <= a.parry ? 'NOW — PARRY!' : 'BLOCK THE ATTACK', w >> 1, by + 8, remain <= a.parry && !a.breath ? P.c.gold : P.c.text, { align: 'center', shadow: true });
    const pad = 5, gap = 4, top = by + 19;
    const bh = y + h - top - pad;
    const cw = Math.floor((w - pad * 2 - gap * 2) / 3);
    const dirs = [[-1, '◀ LEFT', ['ArrowLeft', 'a']], [0, '▲ HIGH', ['ArrowUp', 'w', ' ']], [1, 'RIGHT ▶', ['ArrowRight', 'd']]];
    dirs.forEach(([d, label, keys], i) => {
      const x = pad + i * (cw + gap);
      const hint = S.settings.assist && d === st.pose.dir;
      UI.button('blk' + d, x, top, cw, bh, label, { theme: st.guard === d ? 'gold' : hint ? 'red' : 'steel', sound: false });
      // react on touch-down, not release: blocking must be instant. Each press re-times the guard.
      if (UI.enabled && UI.pointer.pressed && UI.active === 'blk' + d) setGuard(d);
      if (keys.some(k => UI.key(k))) setGuard(d);
    });
    // swipes on the stage
    const sw = UI.swipe(0, L.stageY, w, L.stageH);
    if (sw === 'L') setGuard(-1); else if (sw === 'R') setGuard(1); else if (sw === 'U') setGuard(0);
  }
})();

</script>
<script>
// ---- 36_screens_end.js ----
// ================================================================
// ENDING — the dragon is dead; the North Gate opens at dawn.
// ================================================================
(() => {
  const G = DW.gfx, F = DW.font, UI = DW.ui, A = DW.art, FX = DW.fx, U = DW.util, P = DW.pal;
  const Gm = DW.game, S = DW.state, D = DW.data, App = DW.app;

  let gateSfx = false;
  App.register('ending', {
    enter() {
      gateSfx = false;
      App.music('victory');
      S.flags.gateOpen = true;
      App.save();
    },
    draw(dt, t) {
      const w = G.w, h = G.h, p = S.p;
      A.drawScene('victory', 0, 0, w, h, t, {});
      if (!gateSfx && t > 0.3) { gateSfx = true; App.sfx('gate'); FX.shake(2, 2.5); }

      // titles fade in
      if (t > 1.2) {
        const y = Math.round(h * 0.07);
        F.big('CAPTAIN', w >> 1, y, { scale: 3, ramp: 'gold', align: 'center' });
        F.big('OF THE GUARD', w >> 1, y + 30, { scale: 2, ramp: 'gold', align: 'center' });
        if (t < 1.6) G.dither(0, y - 4, w, 54, null, '#000', Math.round((1.6 - t) / 0.4 * 16));
        F.draw(`Hail, ${p.name} of Darkwood!`, w >> 1, y + 52, P.c.bright, { align: 'center', outline: '#000' });
      }

      if (t > 3.6) {
        const ph = 168;
        const py = h - ph - 6;
        UI.panel(6, py, w - 12, ph, 'gold');
        let y = py + 8;
        const row = (k, v, col) => {
          F.draw(k, 16, y, P.c.dim, { shadow: true });
          F.draw(String(v), w - 16, y, col || P.c.bright, { align: 'right', shadow: true });
          y += 11;
        };
        row('Final level', p.level, P.c.gold);
        row('Creatures slain', `${Gm.totalDefeated()} / ${D.ENEMIES.length}`);
        row('Battles fought', S.stats.fights || 0);
        row('Blocks / parries', `${S.stats.blocks || 0} / ${S.stats.parries || 0}`);
        row('Gold', U.fmt(p.gold), P.c.gold);
        y += 3;
        F.drawWrapped('The North Gate stands open. Beyond it lie wild country, caves and dungeons... and far to the north, the black town of {red}Blackstone{/}, where something stirs beneath the waves.', 16, y, w - 32, P.c.text, { shadow: true });
        if (UI.button('end-ok', 14, py + ph - 28, w - 28, 22, 'RETURN TO DARKWOOD', { theme: 'gold', key: ['Enter', ' '] })) {
          S.flags.victorySeen = true;
          App.save();
          App.go('town');
        }
        if (t > 4.2) F.draw('TO BE CONTINUED', w >> 1, py - 12, Math.floor(t * 2) % 2 ? P.c.gold : P.c.orange, { align: 'center', outline: '#000' });
      }
    },
  });
})();

</script>
<script>
// ---- 99_main.js ----
// ================================================================
// MAIN — boot the canvas, input and audio, then run the frame loop.
// ================================================================
(() => {
  const G = DW.gfx, UI = DW.ui, FX = DW.fx, App = DW.app, Gm = DW.game, S = DW.state;

  // Remember the wanted track so it can start once audio is unlocked by a tap.
  App.music = name => {
    App.wantMusic = name;
    if (DW.audio && DW.audio.music) DW.audio.music(name);
  };

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - (last || now)) / 1000));
    last = now;
    UI.beginFrame();
    FX.update(dt);
    let gameDt = dt;
    if (FX.hitstop > 0) { FX.hitstop -= dt; gameDt = 0; }
    else if (FX.slowmo > 0) gameDt = dt * 0.4;
    G.clear('#000');
    App.frame(dt, gameDt);
    UI.drawToasts(App.name === 'combat' ? 40 : App.HUD_H + 4);
    FX.drawFlash();
    FX.updateWipe(dt);
    FX.drawWipe();
    UI.endFrame();
    requestAnimationFrame(frame);
  }

  DW.main = () => {
    const canvas = document.getElementById('screen');
    G.init(canvas, document.getElementById('wrap'));
    UI.init(canvas);
    UI.onFirstGesture = () => {
      if (DW.audio && DW.audio.unlock) DW.audio.unlock();
      if (App.wantMusic !== undefined) App.music(App.wantMusic);
      UI.onFirstGesture = () => { if (DW.audio && DW.audio.unlock) DW.audio.unlock(); };
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (S.p && App.name !== 'title' && App.name !== 'combat') Gm.save(); }
      else if (DW.audio && DW.audio.unlock) DW.audio.unlock();
    });
    App.go('title', {}, { instant: true });
    requestAnimationFrame(frame);
  };

  if (!window.DW_NO_START) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', DW.main);
    else DW.main();
  }
})();

</script>
