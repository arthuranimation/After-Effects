<script>
// ---- 11_state.js ----
// ================================================================
// STATE — the player, formulas, shops, levelling and save/load.
// Pure logic: no drawing here, so it can be simulated headlessly.
// ================================================================
(() => {
  const D = DW.data, U = DW.util;
  const S = DW.state = { p: null, quest: null, flags: {}, settings: { assist: false }, stats: {}, combat: null };
  const Gm = DW.game = {};

  Gm.SAVE_KEY = 'darkwood_save';
  Gm.VERSION = 3;

  // ---------------------------------------------------------------
  // New game
  // ---------------------------------------------------------------
  Gm.freshPlayer = () => ({
    name: 'Derek', level: 1, xp: 0,
    hp: 30, maxHp: 30, mp: 10, maxMp: 10, gold: 15,
    str: 10, dex: 10, con: 10,
    weapon: 'Dagger', armor: null, ring: null,
    potions: {},          // item name → count (healing and mana)
    wands: {},            // wand name → charges
    tomes: {},            // tome name → true once read
    learned: { double_slash: 1 },   // ability id → rank (1..5)
    slots: ['double_slash'],        // equipped abilities (max D.SLOTS)
    defeated: {},         // enemy name → times defeated
    pendingLevels: [],    // levels whose reward hasn't been chosen yet
  });

  Gm.newGame = () => {
    S.p = Gm.freshPlayer();
    S.quest = null;
    S.flags = { gateOpen: false, victorySeen: false };
    S.stats = { fights: 0, wins: 0, losses: 0, blocks: 0, parries: 0, crits: 0, bestStreak: 0 };
    S.combat = null;
  };

  // ---------------------------------------------------------------
  // Lookups
  // ---------------------------------------------------------------
  Gm.weaponData = name => D.WEAPONS.find(w => w.name === (name || S.p.weapon)) || D.WEAPONS[0];
  Gm.itemData = name => D.ITEMS.find(i => i.name === name) || null;
  Gm.enemyData = name => D.ENEMIES.find(e => e.name === name) || null;
  Gm.abilityData = id => D.ABILITIES.find(a => a.id === id) || null;
  Gm.armorData = () => (S.p.armor ? Gm.itemData(S.p.armor) : null);
  Gm.ringData = () => (S.p.ring ? Gm.itemData(S.p.ring) : null);

  Gm.trait = (w = Gm.weaponData()) => {
    const [kind, n] = (w.trait || '').split(' ');
    return { kind: kind || '', n: parseInt(n, 10) || 0 };
  };

  Gm.gear = () => ({
    weapon: Gm.weaponData().look,
    armor: Gm.armorData() ? Gm.armorData().look : 'none',
  });

  // ---------------------------------------------------------------
  // Formulas
  // ---------------------------------------------------------------
  Gm.bonus = v => Math.floor((v - 10) / 2);
  Gm.xpForLevel = lvl => (lvl <= 1 ? 100 : Math.floor(100 * Math.pow(lvl, 1.5)));
  Gm.xpNext = () => Gm.xpForLevel(S.p.level);

  Gm.speed = () => Math.max(1, 7 + Gm.bonus(S.p.dex) + Gm.weaponData().speed + Math.floor(S.p.level / 4));
  Gm.defense = () => (Gm.armorData() ? Gm.armorData().value : 0) + (Gm.ringData() ? Gm.ringData().value : 0) + Math.max(0, Gm.bonus(S.p.dex));
  Gm.damageBonus = () => Math.max(0, Gm.bonus(S.p.str)) + Math.floor(S.p.level * 2 / 3);
  Gm.critChance = () => {
    const t = Gm.trait();
    return 0.05 + (t.kind === 'crit' ? t.n / 100 : 0) + Math.max(0, Gm.bonus(S.p.dex)) * 0.01;
  };
  Gm.hpPerLevel = () => 4 + Math.max(0, Gm.bonus(S.p.con));
  Gm.vitalityGain = () => 8 + Math.max(0, Gm.bonus(S.p.con)) * 2;
  Gm.ARCANE_GAIN = 4;
  Gm.attackRange = () => {
    const w = Gm.weaponData(), b = Gm.damageBonus();
    return [w.damage_min + b, w.damage_max + b];
  };

  Gm.innCost = () => 10 + S.p.level * 8;
  Gm.tradeIn = cost => Math.floor((cost || 0) * 0.3);

  // ---------------------------------------------------------------
  // Abilities
  // ---------------------------------------------------------------
  Gm.rank = id => S.p.learned[id] || 0;
  Gm.abilityCost = id => {
    const a = Gm.abilityData(id);
    return a ? a.mp + Math.max(0, Gm.rank(id) - 1) : 99;
  };
  Gm.abilityName = id => {
    const a = Gm.abilityData(id);
    if (!a) return id;
    const r = Gm.rank(id);
    return r >= 5 ? a.rank5Name : r <= 1 ? a.name : `${a.name} +${r - 1}`;
  };
  Gm.learnedList = () => D.ABILITIES.filter(a => S.p.learned[a.id]).map(a => a.id);

  Gm.learn = id => {
    if (S.p.learned[id]) return false;
    S.p.learned[id] = 1;
    if (S.p.slots.length < D.SLOTS) S.p.slots.push(id);
    return true;
  };

  Gm.toggleSlot = id => {
    const i = S.p.slots.indexOf(id);
    if (i >= 0) { S.p.slots.splice(i, 1); return 'removed'; }
    if (S.p.slots.length >= D.SLOTS) return 'full';
    S.p.slots.push(id);
    return 'added';
  };
  Gm.replaceSlot = (index, id) => {
    const cur = S.p.slots.indexOf(id);
    if (cur >= 0) S.p.slots.splice(cur, 1);
    S.p.slots[Math.min(index, S.p.slots.length)] = id;
    S.p.slots = S.p.slots.filter(Boolean).slice(0, D.SLOTS);
  };

  // ---------------------------------------------------------------
  // XP and levels. Each level: automatic HP/MP growth, possibly a new
  // ability, then a pending choice (vitality / arcane / mastery).
  // ---------------------------------------------------------------
  Gm.gainXp = n => {
    const p = S.p;
    p.xp += Math.max(0, Math.round(n));
    const gained = [];
    while (p.xp >= Gm.xpNext()) {
      p.xp -= Gm.xpNext();
      p.level++;
      const hpUp = Gm.hpPerLevel();
      p.maxHp += hpUp; p.hp += hpUp;
      p.maxMp += 1; p.mp += 1;
      const ab = D.LEVEL_ABILITIES[p.level];
      if (ab) Gm.learn(ab);
      p.pendingLevels.push(p.level);
      gained.push(p.level);
    }
    return gained;
  };

  // Abilities that can still be ranked up.
  Gm.masteryOptions = () => Gm.learnedList().filter(id => Gm.rank(id) < 5);

  // choice: 'vitality' | 'arcane' | 'mastery' (with ability id). Restores HP and MP fully.
  Gm.chooseLevelReward = (choice, abilityId) => {
    const p = S.p;
    if (!p.pendingLevels.length) return null;
    let msg = '';
    if (choice === 'vitality') {
      const g = Gm.vitalityGain();
      p.maxHp += g;
      msg = `+${g} max HP`;
    } else if (choice === 'arcane') {
      p.maxMp += Gm.ARCANE_GAIN;
      msg = `+${Gm.ARCANE_GAIN} max MP`;
    } else if (choice === 'mastery' && abilityId && Gm.rank(abilityId) > 0 && Gm.rank(abilityId) < 5) {
      p.learned[abilityId]++;
      msg = `${Gm.abilityName(abilityId)} (rank ${p.learned[abilityId]})`;
    } else {
      return null;
    }
    p.hp = p.maxHp; p.mp = p.maxMp;
    p.pendingLevels.shift();
    return msg;
  };

  // ---------------------------------------------------------------
  // Shops. All return { ok, msg }.
  // ---------------------------------------------------------------
  Gm.weaponPrice = w => Math.max(0, w.cost - Gm.tradeIn(Gm.weaponData().cost));
  Gm.buyWeapon = name => {
    const w = Gm.weaponData(name);
    if (!w || w.name === S.p.weapon) return { ok: false, msg: 'Already equipped.' };
    const price = Gm.weaponPrice(w);
    if (S.p.gold < price) return { ok: false, msg: `You need ${U.fmt(price)} gold.` };
    S.p.gold -= price;
    S.p.weapon = w.name;
    return { ok: true, msg: `Equipped the ${w.name}.` };
  };

  Gm.itemPrice = item => {
    if (item.type === 'armor') return Math.max(0, item.cost - Gm.tradeIn(Gm.armorData() ? Gm.armorData().cost : 0));
    if (item.type === 'ring') return Math.max(0, item.cost - Gm.tradeIn(Gm.ringData() ? Gm.ringData().cost : 0));
    return item.cost;
  };

  Gm.itemStatus = item => {
    const p = S.p;
    if (item.type === 'armor' && p.armor === item.name) return 'equipped';
    if (item.type === 'ring' && p.ring === item.name) return 'equipped';
    if (item.type === 'tome' && p.tomes[item.name]) return 'read';
    return '';
  };

  Gm.buyItem = name => {
    const item = Gm.itemData(name);
    const p = S.p;
    if (!item) return { ok: false, msg: '?' };
    const st = Gm.itemStatus(item);
    if (st) return { ok: false, msg: st === 'read' ? 'You have already studied it.' : 'Already equipped.' };
    const price = Gm.itemPrice(item);
    if (p.gold < price) return { ok: false, msg: `You need ${U.fmt(price)} gold.` };
    p.gold -= price;
    switch (item.type) {
      case 'potion':
      case 'mana':
        p.potions[item.name] = (p.potions[item.name] || 0) + 1;
        return { ok: true, msg: `${item.name} (${p.potions[item.name]} carried)` };
      case 'armor':
        p.armor = item.name;
        return { ok: true, msg: `Equipped ${item.name}. Defense ${Gm.defense()}.` };
      case 'ring':
        p.ring = item.name;
        return { ok: true, msg: `Equipped ${item.name}. Defense ${Gm.defense()}.` };
      case 'tome': {
        p[item.stat] += item.value;
        p.tomes[item.name] = true;
        if (item.stat === 'con') { p.maxHp += item.value * 2; p.hp += item.value * 2; }
        return { ok: true, msg: `${item.stat.toUpperCase()} +${item.value}. You feel changed.` };
      }
      case 'wand':
        p.wands[item.name] = (p.wands[item.name] || 0) + item.charges;
        return { ok: true, msg: `${item.name}: ${p.wands[item.name]} charges.` };
    }
    return { ok: false, msg: '?' };
  };

  Gm.potionCount = () => Object.entries(S.p.potions).filter(([n]) => Gm.itemData(n) && Gm.itemData(n).type === 'potion').reduce((s, [, c]) => s + c, 0);
  Gm.wandCharges = () => Object.values(S.p.wands).reduce((s, c) => s + c, 0);

  // ---------------------------------------------------------------
  // Arena progression
  // ---------------------------------------------------------------
  Gm.defeatedIn = tier => D.ENEMIES.filter(e => e.tier === tier && S.p.defeated[e.name]).length;
  Gm.tierUnlocked = tier => tier <= 1 || Gm.defeatedIn(tier - 1) >= D.TIER_UNLOCK;
  Gm.enemyUnlocked = e => {
    if (!Gm.tierUnlocked(e.tier)) return false;
    if (e.name === D.FINAL_BOSS) return D.ENEMIES.filter(o => o.tier === e.tier && o.name !== e.name).every(o => S.p.defeated[o.name]);
    return true;
  };
  Gm.highestTier = () => [4, 3, 2, 1].find(t => Gm.tierUnlocked(t));
  Gm.totalDefeated = () => D.ENEMIES.filter(e => S.p.defeated[e.name]).length;

  // ---------------------------------------------------------------
  // The Rusty Flagon
  // ---------------------------------------------------------------
  Gm.rest = () => {
    const p = S.p;
    if (p.hp >= p.maxHp && p.mp >= p.maxMp) return { ok: false, msg: 'You are already fully rested.' };
    const cost = Gm.innCost();
    if (p.gold < cost) return { ok: false, msg: `A room costs ${cost} gold. You have ${U.fmt(p.gold)}.` };
    p.gold -= cost;
    p.hp = p.maxHp; p.mp = p.maxMp;
    let offer = null;
    if (!S.quest && Math.random() < 0.4) offer = Gm.makeQuest();
    return { ok: true, msg: `You sleep soundly. Health and magic restored. (-${cost}g)`, offer };
  };

  // The stables are free: patch yourself up to half health and magic.
  // (Stops a broken, defeated hero from being stuck at 30% forever.)
  Gm.stables = () => {
    const p = S.p;
    const hp = Math.max(p.hp, Math.ceil(p.maxHp * 0.5)), mp = Math.max(p.mp, Math.ceil(p.maxMp * 0.5));
    if (hp === p.hp && mp === p.mp) return { ok: false, msg: 'The straw will do you no more good. You need a real bed.' };
    p.hp = hp; p.mp = mp;
    return { ok: true, msg: 'You sleep in the straw beside the horses. Half rested.' };
  };

  Gm.makeQuest = () => {
    const pool = D.ENEMIES.filter(e => Gm.enemyUnlocked(e) && e.name !== D.FINAL_BOSS);
    if (!pool.length) return null;
    // favour foes near the player's frontier
    const top = Gm.highestTier();
    const near = pool.filter(e => e.tier >= top - 1);
    const e = U.pick(near.length ? near : pool);
    const reward = Math.round(e.gold * 1.5 + 30);
    const giver = U.rand(0, D.QUEST_GIVERS.length - 1);
    return { enemy: e.name, reward, giver };
  };
  Gm.questText = q => D.QUEST_GIVERS[q.giver || 0].replace('{enemy}', '{red}' + q.enemy + '{/}').replace('{reward}', '{gold}' + q.reward + '{/}');
  Gm.acceptQuest = q => { S.quest = q; };

  // ---------------------------------------------------------------
  // Save / load (localStorage). Old v1/v2 saves from Darkwood 8 migrate.
  // ---------------------------------------------------------------
  Gm.save = () => {
    if (!S.p) return false;
    const data = { v: Gm.VERSION, player: S.p, quest: S.quest, flags: S.flags, settings: S.settings, stats: S.stats };
    try { localStorage.setItem(Gm.SAVE_KEY, JSON.stringify(data)); return true; } catch (_) { return false; }
  };

  Gm.readSave = () => {
    try {
      const raw = localStorage.getItem(Gm.SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  };
  Gm.hasSave = () => !!Gm.readSave();
  Gm.clearSave = () => { try { localStorage.removeItem(Gm.SAVE_KEY); } catch (_) { /* ignore */ } };

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

  Gm.load = () => {
    const data = Gm.readSave();
    if (!data || !data.player) return false;
    try {
      if (data.v === 3) {
        const base = Gm.freshPlayer();
        const pd = data.player;
        S.p = Object.assign(base, pd);
        S.p.potions = pd.potions || {}; S.p.wands = pd.wands || {}; S.p.tomes = pd.tomes || {};
        S.p.learned = pd.learned || { double_slash: 1 };
        S.p.slots = (pd.slots || []).filter(id => S.p.learned[id]).slice(0, D.SLOTS);
        S.p.defeated = pd.defeated || {};
        S.p.pendingLevels = pd.pendingLevels || [];
        if (!D.WEAPONS.find(w => w.name === S.p.weapon)) S.p.weapon = 'Dagger';
        S.quest = data.quest || null;
        S.flags = Object.assign({ gateOpen: false, victorySeen: false }, data.flags || {});
        S.settings = Object.assign({ assist: false }, data.settings || {});
        S.stats = Object.assign({ fights: 0, wins: 0, losses: 0, blocks: 0, parries: 0, crits: 0, bestStreak: 0 }, data.stats || {});
      } else {
        Gm.migrate(data);
      }
      S.combat = null;
      return true;
    } catch (e) {
      console.error('load failed', e);
      return false;
    }
  };

  // Darkwood 8.0 (save v1/v2) → v3
  Gm.migrate = data => {
    Gm.newGame();
    const p = S.p, pd = data.player;
    p.name = pd.name || 'Derek';
    p.level = Math.max(1, num(pd.level, 1));
    p.xp = Math.max(0, num(pd.xp, 0));
    p.maxHp = Math.max(30, num(pd.maxHp, 30));
    p.hp = U.clamp(num(pd.hp, p.maxHp), 1, p.maxHp);
    const oldMaxMp = num(pd.maxMp, 5);
    const arcanePicks = Math.max(0, Math.round((oldMaxMp - 5) / 2));
    p.maxMp = 10 + (p.level - 1) + arcanePicks * Gm.ARCANE_GAIN;
    p.mp = p.maxMp;
    p.gold = Math.max(0, num(pd.gold, 0));
    p.str = num(pd.str, 10); p.dex = num(pd.dex, 10); p.con = num(pd.con, 10);
    if (pd.weaponName && D.WEAPONS.find(w => w.name === pd.weaponName)) p.weapon = pd.weaponName;
    if (pd.armorName && Gm.itemData(pd.armorName)) p.armor = pd.armorName;
    if (pd.ringName && Gm.itemData(pd.ringName)) p.ring = pd.ringName;
    (pd.potionNames || []).forEach(n => { if (Gm.itemData(n)) p.potions[n] = (p.potions[n] || 0) + 1; });
    (pd.wands || []).forEach(w => { if (Gm.itemData(w.name)) p.wands[w.name] = (p.wands[w.name] || 0) + num(w.charges, 0); });
    (pd.tomes || []).forEach(t => { p.tomes[t] = true; });
    (pd.defeated || []).forEach(n => { if (Gm.enemyData(n)) p.defeated[n] = 1; });
    // 8.0 could silently overwrite abilities; give back everything earned by level.
    p.learned = {};
    for (let l = 1; l <= p.level; l++) if (D.LEVEL_ABILITIES[l]) p.learned[D.LEVEL_ABILITIES[l]] = 1;
    (pd.abilities || []).forEach(a => { if (a && Gm.abilityData(a.id)) p.learned[a.id] = U.clamp(num(a.rank, 1), 1, 5); });
    p.slots = (pd.abilities || []).map(a => a && a.id).filter(id => p.learned[id]).slice(0, D.SLOTS);
    if (!p.slots.length) p.slots = Object.keys(p.learned).slice(0, D.SLOTS);
    if (data.quest && Gm.enemyData(data.quest.enemyName)) S.quest = { enemy: data.quest.enemyName, reward: num(data.quest.reward, 100), giver: 0 };
    if (p.defeated[D.FINAL_BOSS]) S.flags.gateOpen = true;
  };
})();

</script>
<script>
// ---- 12_combat.js ----
// ================================================================
// COMBAT ENGINE — initiative, attacks, blocking, abilities, statuses.
// Pure logic. It never draws or waits: the combat screen drives it
//   next()            → { type: 'player' | 'enemy' | 'skip' | 'over' }
//   act(kind, arg)    → the player's action
//   resolveAttack(guardDir, guardMsBeforeStrike) → the enemy's blow lands
// and plays the events it queues in c.events (damage numbers, sounds,
// animations). The same code runs in the headless balance simulator.
// ================================================================
(() => {
  const D = DW.data, U = DW.util, Gm = DW.game, S = DW.state;
  const C = DW.combat = {};

  const ev = (c, e) => { c.events.push(e); if (e.t === 'log') c.log.push(e); };
  const say = (c, text, col = 'text') => ev(c, { t: 'log', text, col });

  // ---------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------
  C.start = (enemyName, streak = 0) => {
    const e = Gm.enemyData(enemyName);
    const pS = Gm.speed(), eS = e.speed;
    let pg, eg;
    if (pS > eS) { pg = 100; eg = Math.round(eS / pS * 100); }
    else if (eS > pS) { eg = 100; pg = Math.round(pS / eS * 100); }
    else { pg = Math.random() < 0.5 ? 100 : 99; eg = pg === 100 ? 99 : 100; }
    const hp = streak > 0 ? Math.round(e.hp * 1.25) : e.hp;
    const c = S.combat = {
      enemy: e, streak,
      lives: streak + 1, livesLeft: streak + 1,
      ehp: hp, emax: hp,
      pg, eg, over: false, result: null, rewards: null,
      pst: [], est: [],           // statuses: { type, turns, ...data, fresh }
      petrified: false,
      last: null, turnNo: 0,
      pending: null,              // the enemy attack being wound up
      log: [], events: [],
      dealt: 0, taken: 0, blocks: 0, parries: 0,
    };
    S.stats.fights = (S.stats.fights || 0) + 1;
    if (streak === 0) {
      say(c, `The ${e.name} stands before you.`, 'dim');
    } else {
      say(c, `The ${e.name} returns, angrier. It has ${c.lives} lives this time.`, 'red');
    }
    say(c, (pg >= eg ? 'You have' : `The ${e.name} has`) + ' the initiative.', 'dim');
    return c;
  };

  // ---------------------------------------------------------------
  // Speeds & multipliers
  // ---------------------------------------------------------------
  const st = (arr, type) => arr.find(s => s.type === type);
  const addSt = (arr, s) => { const i = arr.findIndex(x => x.type === s.type); if (i >= 0) arr.splice(i, 1); arr.push(s); };
  const dropSt = (arr, type) => { const i = arr.findIndex(x => x.type === type); if (i >= 0) arr.splice(i, 1); };

  C.enemySpeed = (c = S.combat) => {
    let spd = c.enemy.speed;
    const sl = st(c.est, 'slow'); if (sl) spd *= 1 - sl.pct;
    const sh = st(c.est, 'shatter'); if (sh && sh.spdPct) spd *= 1 - sh.spdPct;
    return Math.max(1, Math.round(spd));
  };

  C.playerSpeed = (c = S.combat) => {
    let spd = Gm.speed();
    if (!c) return spd;
    const su = st(c.pst, 'surge'); if (su) spd = Math.max(spd, C.enemySpeed(c) + 1);
    if (st(c.pst, 'exhaust')) spd = Math.max(1, Math.round(spd * 0.67));
    return spd;
  };

  const playerDamageMult = c => {
    let m = 1;
    const pw = st(c.pst, 'power'); if (pw) m *= pw.mult;
    const su = st(c.pst, 'surge'); if (su && su.bonus) m *= 1 + su.bonus;
    return m;
  };

  const enemyArmor = (c, pierce = 0) => {
    let a = c.enemy.armor;
    const sh = st(c.est, 'shatter'); if (sh) a *= 1 - sh.armorPct;
    a *= 1 - pierce;
    const t = Gm.trait();
    if (t.kind === 'crush') a -= t.n;
    return Math.max(0, Math.round(a));
  };

  const takenMult = c => { const sh = st(c.est, 'shatter'); return sh ? 1 + sh.taken : 1; };
  const holyMult = c => (Gm.trait().kind === 'holy' && (c.enemy.kind === 'undead' || c.enemy.kind === 'fiend') ? 1.5 : 1);

  // One weapon blow. Returns { dmg, crit }.
  C.weaponHit = (c, mult = 1, opts = {}) => {
    const w = Gm.weaponData();
    let raw = U.rand(w.damage_min, w.damage_max) + Gm.damageBonus();
    const crit = !opts.noCrit && Math.random() < Gm.critChance();
    if (crit) raw *= 2;
    let dmg = Math.max(1, raw - enemyArmor(c, opts.pierce || 0));
    dmg = dmg * mult * playerDamageMult(c) * takenMult(c) * holyMult(c);
    return { dmg: Math.max(1, Math.round(dmg)), crit };
  };

  // Damage to the enemy; returns true if it died (or lost a life).
  const hurtEnemy = (c, dmg, src = 'melee', crit = false) => {
    dmg = Math.max(0, Math.round(dmg));
    c.ehp -= dmg; c.dealt += dmg;
    if (crit) S.stats.crits = (S.stats.crits || 0) + 1;
    ev(c, { t: 'eDamage', dmg, crit, src });
    return checkEnemy(c);
  };

  const checkEnemy = c => {
    if (c.ehp > 0) return false;
    c.livesLeft--;
    if (c.livesLeft > 0) {
      const hp = Math.round(c.enemy.hp * 1.5);
      c.ehp = hp; c.emax = hp;
      c.eg = 100; c.pg = Math.min(c.pg, 50); c.last = null;
      c.est = c.est.filter(s => s.type === 'shatter');
      say(c, `The ${c.enemy.name} staggers... and rises again! (${c.livesLeft} ${c.livesLeft === 1 ? 'life' : 'lives'} left)`, 'red');
      ev(c, { t: 'enemyRise' });
      return true;
    }
    c.ehp = 0;
    say(c, `The ${c.enemy.name} collapses. Victory!`, 'gold');
    ev(c, { t: 'enemyDie' });
    end(c, 'win');
    return true;
  };

  const hurtPlayer = (c, dmg) => {
    const p = S.p;
    p.hp = Math.max(0, p.hp - dmg);
    c.taken += dmg;
    if (p.hp <= 0) {
      say(c, 'You have fallen in battle.', 'red');
      ev(c, { t: 'playerDie' });
      end(c, 'lose');
      return true;
    }
    return false;
  };

  const end = (c, result) => { c.over = true; c.result = result; c.pending = null; };

  // ---------------------------------------------------------------
  // Turn order
  // ---------------------------------------------------------------
  // Who acts next, without changing anything (for the turn-order strip).
  C.preview = (n = 5, c = S.combat) => {
    if (!c) return [];
    let pg = c.pg, eg = c.eg;
    const pS = C.playerSpeed(c), eS = C.enemySpeed(c);
    const out = [];
    for (let i = 0; i < n; i++) {
      while (pg < 100 && eg < 100) { pg += pS; eg += eS; }
      const who = pick(pg, eg, pS, eS);
      out.push(who);
      if (who === 'p') pg -= 100; else eg -= 100;
    }
    return out;
  };
  const pick = (pg, eg, pS, eS) => {
    if (pg >= 100 && eg >= 100) return pg > eg ? 'p' : eg > pg ? 'e' : (eS > pS ? 'e' : 'p');
    return pg >= 100 ? 'p' : 'e';
  };

  C.next = () => {
    const c = S.combat;
    if (!c || c.over) return { type: 'over' };
    const pS = C.playerSpeed(c), eS = C.enemySpeed(c);
    while (c.pg < 100 && c.eg < 100) { c.pg += pS; c.eg += eS; }
    const who = pick(c.pg, c.eg, pS, eS);
    c.turnNo++;

    if (who === 'e') {
      c.eg -= 100;
      if (c.last === 'e') say(c, `The ${c.enemy.name} moves with terrifying speed — again!`, 'orange');
      c.last = 'e';
      // start-of-turn effects
      const burn = st(c.est, 'burn');
      if (burn) {
        say(c, `The ${c.enemy.name} burns for ${burn.value}.`, 'orange');
        if (hurtEnemy(c, burn.value, 'burn')) return c.over ? { type: 'over' } : { type: 'skip', who: 'enemy' };
        burn.value = Math.max(1, Math.floor(burn.value * burn.decay));
        if (--burn.turns <= 0) dropSt(c.est, 'burn');
      }
      const frost = st(c.est, 'frost');
      if (frost) {
        say(c, `Frostbite gnaws at the ${c.enemy.name} for ${frost.value}.`, 'ice');
        if (hurtEnemy(c, frost.value, 'frost')) return c.over ? { type: 'over' } : { type: 'skip', who: 'enemy' };
      }
      if (c.enemy.special === 'regen') {
        if (st(c.est, 'burn')) {
          say(c, `The flames stop the ${c.enemy.name}'s wounds from closing!`, 'orange');
        } else if (c.ehp < c.emax) {
          const r = Math.min(c.emax - c.ehp, Math.max(1, Math.floor(c.enemy.hp * 0.05)));
          c.ehp += r;
          say(c, `The ${c.enemy.name} regenerates ${r} HP.`, 'green');
          ev(c, { t: 'regen', amount: r });
        }
      }
      if (st(c.est, 'stun')) {
        dropSt(c.est, 'stun');
        say(c, `The ${c.enemy.name} is stunned and loses its turn!`, 'green');
        ev(c, { t: 'stun', who: 'enemy' });
        endEnemyTurn(c);
        return { type: 'skip', who: 'enemy' };
      }
      c.pending = makeAttack(c, false);
      return { type: 'enemy', attack: c.pending };
    }

    c.pg -= 100;
    if (c.petrified) {
      c.petrified = false;
      dropSt(c.pst, 'petrify');
      say(c, 'You are petrified and cannot move!', 'red');
      ev(c, { t: 'stun', who: 'player' });
      c.last = 'p';
      endPlayerTurn(c);
      return { type: 'skip', who: 'player' };
    }
    if (c.last === 'p') say(c, 'You move with superior speed — you act again!', 'green');
    c.last = 'p';
    return { type: 'player' };
  };

  // ---------------------------------------------------------------
  // Enemy attacks: direction, wind-up length, feints and combos.
  // ---------------------------------------------------------------
  const DIRS = [-1, 0, 1];
  const pickDir = (m, avoid) => {
    const ws = [m.L, m.H, m.R].map((w, i) => (DIRS[i] === avoid ? 0 : w));
    const total = ws.reduce((a, b) => a + b, 0) || 1;
    let r = Math.random() * total;
    for (let i = 0; i < 3; i++) { r -= ws[i]; if (r < 0) return DIRS[i]; }
    return 0;
  };

  C.windupMs = (c = S.combat) => {
    const spd = C.enemySpeed(c);
    let ms = U.clamp(1750 - (spd - 4) * 85, 700, 1800) * (1 - 0.05 * (c.enemy.tier - 1));
    if (S.settings.assist) ms *= 1.4;
    return Math.round(ms);
  };

  const makeAttack = (c, isCombo, prevDir) => {
    const m = c.enemy.moves;
    const dir = pickDir(m, isCombo ? prevDir : undefined);
    let windup = C.windupMs(c);
    if (isCombo) windup = Math.round(windup * 0.6);
    const parry = Math.round(Math.max(200, windup * 0.28) * (S.settings.assist ? 1.3 : 1));
    const a = { dir, windup, parry, isCombo, combo: false, feintAt: 0, feintDir: dir, breath: false };
    if (!isCombo && Math.random() < (m.combo || 0)) a.combo = true;
    if (!isCombo && Math.random() < (m.feint || 0)) {
      a.feintAt = Math.round(windup * 0.45);
      a.feintDir = pickDir(m, dir);
    }
    a.final = a.feintAt ? a.feintDir : dir;
    a.breath = c.enemy.special === 'fire' && a.final === 0 && (c.enemy.kind === 'dragon' || Math.random() < 0.5);
    return a;
  };

  // guardDir: -1/0/1 or null (never blocked). guardMs: ms before the strike
  // that the final guard input happened (smaller = later = parry).
  // Returns { combo: attack } when a follow-up strike begins, else {}.
  C.resolveAttack = (guardDir, guardMs = 9999) => {
    const c = S.combat;
    if (!c || c.over || !c.pending) return {};
    const a = c.pending;
    const e = c.enemy, p = S.p;
    const dir = a.final;
    const blocked = guardDir !== null && guardDir !== undefined && guardDir === dir;
    const parried = blocked && guardMs <= a.parry && !a.breath;

    const roll = U.rand(e.damage_min, e.damage_max);
    const def = Gm.defense();
    let dmg = Math.max(1, roll - (e.special === 'fire' ? Math.floor(def / 4) : Math.floor(def / 2)));
    if (st(c.pst, 'exhaust')) dmg = Math.round(dmg * 1.25);
    const what = a.breath ? 'breathes fire on you' : 'strikes you';

    const rip = st(c.pst, 'riposte');
    if (parried) {
      c.parries++; S.stats.parries = (S.stats.parries || 0) + 1;
      p.mp = Math.min(p.maxMp, p.mp + 2);
      c.pg += 25;
      say(c, 'PARRY! You turn the blow aside completely. (+2 MP)', 'gold');
      ev(c, { t: 'parry', dir });
      ev(c, { t: 'pDamage', dmg: 0, blocked: true, parried: true, dir });
    } else if (blocked) {
      c.blocks++; S.stats.blocks = (S.stats.blocks || 0) + 1;
      dmg = Math.max(1, Math.round(dmg * (a.breath ? 0.35 : 0.2)));
      p.mp = Math.min(p.maxMp, p.mp + 1);
      say(c, `Blocked! Only ${dmg} damage gets through. (+1 MP)`, 'green');
      ev(c, { t: 'block', dir });
      ev(c, { t: 'pDamage', dmg, blocked: true, parried: false, dir });
      if (hurtPlayer(c, dmg)) return {};
    } else {
      say(c, `The ${e.name} ${what} for ${dmg}${guardDir !== null && guardDir !== undefined ? ' — wrong side!' : '.'}`, 'red');
      ev(c, { t: 'pDamage', dmg, blocked: false, parried: false, dir, breath: a.breath });
      if (hurtPlayer(c, dmg)) return {};
      if (e.special === 'drain' && Math.random() < 0.3 && p.xp > 0) {
        const lost = Math.max(1, Math.floor(p.xp * 0.1));
        p.xp -= lost;
        say(c, `Its touch drains ${lost} XP from you!`, 'purple');
        ev(c, { t: 'drain', amount: lost });
      }
      if (e.special === 'petrify' && Math.random() < 0.25) {
        c.petrified = true;
        addSt(c.pst, { type: 'petrify', turns: 1 });
        say(c, 'Its gaze meets yours. You are turning to stone!', 'red');
        ev(c, { t: 'status', who: 'player', type: 'petrify' });
      }
    }

    // Riposte: counter on a block, spent either way
    if (rip) {
      if (blocked) {
        const mult = [1.5, 1.75, 2, 2, 2.5][rip.rank - 1];
        const h = C.weaponHit(c, mult);
        say(c, `RIPOSTE! You counter for ${h.dmg}${h.crit ? ' (critical!)' : ''}.`, 'gold');
        ev(c, { t: 'counter' });
        if (rip.rank >= 4) addSt(c.est, { type: 'stun', turns: 1 });
        if (hurtEnemy(c, h.dmg, 'counter', h.crit)) { if (c.over) return {}; }
      }
      if (--rip.charges <= 0) dropSt(c.pst, 'riposte');
    }

    if (!c.over && a.combo && !a.isCombo) {
      c.pending = makeAttack(c, true, dir);
      say(c, `The ${e.name} strikes again!`, 'orange');
      return { combo: c.pending };
    }
    c.pending = null;
    endEnemyTurn(c);
    return {};
  };

  const endEnemyTurn = c => {
    for (const s of [...c.est]) {
      if (s.type === 'shatter' || s.type === 'burn' || s.type === 'stun') continue;
      if (s.fresh) { s.fresh = false; continue; }
      if (--s.turns <= 0) dropSt(c.est, s.type);
    }
  };

  const endPlayerTurn = c => {
    for (const s of [...c.pst]) {
      if (s.type === 'riposte' || s.type === 'petrify') continue;
      if (s.fresh) { s.fresh = false; continue; }
      if (--s.turns <= 0) {
        dropSt(c.pst, s.type);
        if (s.type === 'power' && s.exhaust > 0) {
          addSt(c.pst, { type: 'exhaust', turns: s.exhaust });
          say(c, `Your strength fades. You are exhausted for ${s.exhaust} turns.`, 'red');
          ev(c, { t: 'status', who: 'player', type: 'exhaust' });
        }
      }
    }
  };

  // ---------------------------------------------------------------
  // Player actions
  // ---------------------------------------------------------------
  C.canAct = (kind, arg) => {
    const c = S.combat, p = S.p;
    if (!c || c.over || c.pending) return false;
    if (kind === 'ability') return p.slots.includes(arg) && p.mp >= Gm.abilityCost(arg);
    if (kind === 'potion') return (p.potions[arg] || 0) > 0;
    if (kind === 'wand') return (p.wands[arg] || 0) > 0;
    return true;
  };

  C.act = (kind, arg) => {
    const c = S.combat;
    if (!C.canAct(kind, arg)) return false;
    if (kind === 'attack') actAttack(c);
    else if (kind === 'ability') actAbility(c, arg);
    else if (kind === 'potion') actPotion(c, arg);
    else if (kind === 'wand') actWand(c, arg);
    else if (kind === 'flee') actFlee(c);
    if (!c.over) endPlayerTurn(c);
    return true;
  };

  const actAttack = c => {
    const h = C.weaponHit(c);
    ev(c, { t: 'pAttack' });
    say(c, `You strike the ${c.enemy.name} for ${h.dmg}${h.crit ? ' — critical!' : '.'}`, h.crit ? 'gold' : 'text');
    hurtEnemy(c, h.dmg, 'melee', h.crit);
  };

  const actPotion = (c, name) => {
    const p = S.p, item = Gm.itemData(name);
    p.potions[name]--;
    if (p.potions[name] <= 0) delete p.potions[name];
    ev(c, { t: 'drink' });
    if (item.type === 'mana') {
      const amt = Math.min(item.value, p.maxMp - p.mp);
      p.mp += amt;
      say(c, `You drink the ${name}. +${amt} MP.`, 'blue');
      ev(c, { t: 'mp', amount: amt });
    } else {
      const heal = item.value >= 999 ? p.maxHp : item.value;
      const amt = Math.min(heal, p.maxHp - p.hp);
      p.hp += amt;
      say(c, `You drink the ${name}. +${amt} HP.`, 'green');
      ev(c, { t: 'heal', amount: amt });
    }
  };

  const actWand = (c, name) => {
    const p = S.p, item = Gm.itemData(name);
    p.wands[name]--;
    if (p.wands[name] <= 0) delete p.wands[name];
    const spread = item.element === 'fire' ? 15 : 10;
    const dmg = Math.round(U.rand(item.value - spread, item.value + spread) * takenMult(c));
    ev(c, { t: 'cast', id: item.element === 'fire' ? 'wand_fire' : 'wand_lightning' });
    if (item.element === 'fire') {
      say(c, `Your Fire Wand erupts for ${dmg}!`, 'orange');
      if (hurtEnemy(c, dmg, 'fire')) return;
      addSt(c.est, { type: 'burn', turns: 2, value: Math.max(1, Math.round(dmg * 0.25)), decay: 0.5, fresh: true });
    } else {
      say(c, `Lightning crackles from your wand for ${dmg}!`, 'blue');
      if (hurtEnemy(c, dmg, 'lightning')) return;
      if (Math.random() < 0.25) {
        addSt(c.est, { type: 'stun', turns: 1 });
        say(c, `The ${c.enemy.name} is stunned!`, 'green');
      }
    }
  };

  const actFlee = c => {
    const chance = U.clamp(0.5 + (C.playerSpeed(c) - C.enemySpeed(c)) * 0.05 + Math.max(0, Gm.bonus(S.p.dex)) * 0.03, 0.15, 0.9);
    if (Math.random() < chance) {
      say(c, 'You escape the arena!', 'dim');
      ev(c, { t: 'flee', ok: true });
      end(c, 'fled');
    } else {
      say(c, `You try to flee, but the ${c.enemy.name} cuts you off!`, 'red');
      ev(c, { t: 'flee', ok: false });
    }
  };

  const actAbility = (c, id) => {
    const p = S.p, r = Gm.rank(id), name = Gm.abilityName(id);
    p.mp -= Gm.abilityCost(id);
    ev(c, { t: 'cast', id });
    switch (id) {
      case 'double_slash': {
        const hits = [2, 2, 3, 3, 4][r - 1], mult = [1, 1.1, 1, 1.1, 1.1][r - 1];
        say(c, `${name}: ${hits} rapid strikes!`, 'gold');
        let total = 0;
        for (let i = 0; i < hits && !c.over; i++) {
          const h = C.weaponHit(c, mult);
          total += h.dmg;
          ev(c, { t: 'pAttack', quick: true });
          if (hurtEnemy(c, h.dmg, 'melee', h.crit) && (c.over || c.ehp === c.emax)) break;
        }
        say(c, `Total: ${total} damage.`, 'text');
        break;
      }
      case 'fireball': {
        const w = Gm.weaponData();
        const base = (U.rand(w.damage_min, w.damage_max) + Gm.damageBonus()) * 1.5 + 8 + p.level;
        const pierce = r >= 5 ? 1 : 0.5;
        const impact = Math.max(1, Math.round((base - enemyArmor(c, pierce)) * playerDamageMult(c) * takenMult(c)));
        say(c, `${name}: fire engulfs the ${c.enemy.name} for ${impact}!`, 'orange');
        if (hurtEnemy(c, impact, 'fire')) break;
        addSt(c.est, { type: 'burn', turns: [3, 4, 4, 5, 5][r - 1], value: Math.max(1, Math.floor(impact * 0.5)), decay: [0.5, 0.5, 0.7, 0.7, 0.75][r - 1], fresh: true });
        break;
      }
      case 'icy_rain': {
        const h = C.weaponHit(c, 0.6);
        const pct = [0.33, 0.4, 0.4, 0.45, 0.5][r - 1], turns = [3, 3, 4, 4, 5][r - 1];
        say(c, `${name}: ice shards hit for ${h.dmg}. Slowed ${Math.round(pct * 100)}%!`, 'ice');
        if (hurtEnemy(c, h.dmg, 'ice', h.crit)) break;
        addSt(c.est, { type: 'slow', turns, pct, fresh: true });
        if (r >= 4) addSt(c.est, { type: 'frost', turns, value: 2 + Math.floor(p.level / 2), fresh: true });
        if (r >= 5) { addSt(c.est, { type: 'stun', turns: 1 }); say(c, `The ${c.enemy.name} is frozen solid!`, 'ice'); }
        break;
      }
      case 'speed_warrior': {
        const turns = [3, 4, 4, 5, 5][r - 1], bonus = [0, 0, 0.1, 0.1, 0.15][r - 1];
        addSt(c.pst, { type: 'surge', turns, bonus, fresh: true });
        say(c, `${name}: you move like the wind for ${turns} turns.`, 'blue');
        if (r >= 5) c.pg = Math.max(c.pg, 100);
        break;
      }
      case 'ultra_strength': {
        const mult = [1.5, 1.5, 1.5, 1.6, 1.75][r - 1], turns = r >= 5 ? 4 : 3, exhaust = [3, 2, 1, 0, 0][r - 1];
        dropSt(c.pst, 'exhaust');
        addSt(c.pst, { type: 'power', turns, mult, exhaust, fresh: true });
        say(c, `${name}: savage power surges through you (×${mult}) for ${turns} turns!`, 'red');
        break;
      }
      case 'rallying_cry': {
        const pct = [0.15, 0.2, 0.25, 0.3, 0.35][r - 1];
        const amt = Math.min(p.maxHp - p.hp, Math.round(p.maxHp * pct));
        p.hp += amt;
        say(c, `${name}: you find your resolve. +${amt} HP.`, 'green');
        ev(c, { t: 'heal', amount: amt });
        if (r >= 3) {
          const bad = c.pst.filter(s => s.type === 'exhaust' || s.type === 'petrify');
          const n = r >= 4 ? bad.length : Math.min(1, bad.length);
          for (let i = 0; i < n; i++) dropSt(c.pst, bad[i].type);
          if (n) { c.petrified = c.petrified && !!st(c.pst, 'petrify'); say(c, 'Your ailments fade.', 'green'); }
        }
        if (r >= 5) c.pg += 30;
        break;
      }
      case 'riposte': {
        addSt(c.pst, { type: 'riposte', rank: r, charges: r >= 5 ? 2 : 1 });
        say(c, `${name}: you ready a counter. Block the next blow!`, 'gold');
        break;
      }
      case 'shatter': {
        const armorPct = [0.4, 0.5, 0.6, 0.8, 1][r - 1], taken = [0.1, 0.1, 0.15, 0.15, 0.2][r - 1], spdPct = [0, 0, 0.1, 0.1, 0.15][r - 1];
        addSt(c.est, { type: 'shatter', turns: 999, armorPct, taken, spdPct });
        say(c, `${name}: you break the ${c.enemy.name}'s guard!`, 'gold');
        if (r >= 5) addSt(c.est, { type: 'stun', turns: 1 });
        break;
      }
      case 'vanish': {
        const goldPct = [0, 0.25, 0.5, 0.75, 1][r - 1];
        c.rewards = { gold: Math.round(c.enemy.gold * goldPct), xp: r >= 5 ? Math.round(c.enemy.xp * 0.5) : 0 };
        say(c, `${name}: you dissolve into shadow.`, 'purple');
        ev(c, { t: 'vanish' });
        end(c, 'vanish');
        break;
      }
    }
  };

  // Statuses for display: [{ type, turns, who }]
  C.statusList = (who, c = S.combat) => {
    if (!c) return [];
    return (who === 'player' ? c.pst : c.est).map(s => ({ type: s.type, turns: s.turns >= 999 ? 0 : s.turns, charges: s.charges }));
  };

  // ---------------------------------------------------------------
  // Finish: apply rewards / penalties. Returns a summary for the screen.
  // ---------------------------------------------------------------
  C.finish = () => {
    const c = S.combat, p = S.p, e = c.enemy;
    if (!c || c.finished) return c && c.summary;
    c.finished = true;
    const sum = { result: c.result, xp: 0, gold: 0, questGold: 0, levels: [], lostGold: 0, enemy: e.name, streak: c.streak, final: false };
    if (c.result === 'win') {
      S.stats.wins = (S.stats.wins || 0) + 1;
      S.stats.bestStreak = Math.max(S.stats.bestStreak || 0, c.streak);
      sum.xp = e.xp;
      sum.gold = Math.round(e.gold * Math.pow(1.5, c.streak));
      p.gold += sum.gold;
      p.defeated[e.name] = (p.defeated[e.name] || 0) + 1;
      if (S.quest && S.quest.enemy === e.name) {
        sum.questGold = S.quest.reward;
        p.gold += sum.questGold;
        S.quest = null;
      }
      sum.final = e.name === D.FINAL_BOSS;
      sum.levels = Gm.gainXp(sum.xp);
    } else if (c.result === 'lose') {
      S.stats.losses = (S.stats.losses || 0) + 1;
      sum.lostGold = Math.floor(p.gold * 0.25);
      p.gold -= sum.lostGold;
      p.hp = Math.max(1, Math.floor(p.maxHp * 0.3));
      p.mp = Math.max(p.mp, Math.floor(p.maxMp * 0.3));
    } else if (c.result === 'vanish' && c.rewards) {
      sum.gold = c.rewards.gold; sum.xp = c.rewards.xp;
      p.gold += sum.gold;
      if (sum.xp) sum.levels = Gm.gainXp(sum.xp);
    }
    c.summary = sum;
    Gm.save();
    return sum;
  };
})();

</script>
<script>
// ---- 21_art_enemies_t1.js ----
// ================================================================
// ENEMIES — TIER I, "The Pit": Giant Rat, Kobold, Goblin, Skeleton, Orc.
// Procedural pixel art painted with DW.kit. Each enemy is a small rig:
// key poses are joint positions, the engine's pose is a blend of the
// idle pose and one key pose, and the painter draws the body back to
// front from those joints.
// ================================================================
(() => {
  const K = DW.kit, P = DW.pal, U = DW.util;
  const R = P.ramps;
  const E = DW.art.enemies;

  // ---------------------------------------------------------------
  // Shared helpers
  // ---------------------------------------------------------------
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;

  // Blend two key poses (numbers, arrays, nested objects; others snap at t=.5).
  const mix = (a, b, t) => {
    if (b === undefined) return a;
    if (typeof a === 'number') return lerp(a, b, t);
    if (Array.isArray(a)) return a.map((v, i) => mix(v, b[i], t));
    if (a && typeof a === 'object') {
      const o = {};
      for (const k in a) o[k] = mix(a[k], b[k], t);
      for (const k in b) if (!(k in a)) o[k] = b[k];
      return o;
    }
    return t < 0.5 ? a : b;
  };

  // Two-bone IK: returns the middle joint (elbow / knee) for A -> C.
  const ik = (ax, ay, cx, cy, l1, l2, bend) => {
    let dx = cx - ax, dy = cy - ay, d = Math.hypot(dx, dy) || 0.001;
    const maxd = (l1 + l2) * 0.995;
    if (d > maxd) { cx = ax + dx / d * maxd; cy = ay + dy / d * maxd; dx = cx - ax; dy = cy - ay; d = maxd; }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = ax + dx * a / d, my = ay + dy * a / d;
    return [mx - dy / d * h * bend, my + dx / d * h * bend, cx, cy];
  };

  // A view: the kit's primitives through a transform (scale about the
  // anchor, shift, and a lean that shears the body above the feet).
  const view = (S, t = {}) => {
    const ax = t.ax || 0, ay = t.ay || 0, k = t.k || 1, dx = t.dx || 0, dy = t.dy || 0, sh = t.sh || 0;
    const X = (x, y) => ax + (x - ax) * k + dx + (ay - y) * sh;
    const Y = (x, y) => ay + (y - ay) * k + dy;
    const V = {
      S, k, X, Y, t,
      ball: (x, y, rx, ry, r, o) => S.ball(X(x, y), Y(x, y), rx * k, ry * k, r, o),
      capsule: (x1, y1, x2, y2, r1, r2, r, o) => S.capsule(X(x1, y1), Y(x1, y1), X(x2, y2), Y(x2, y2), r1 * k, r2 * k, r, o),
      horn: (x0, y0, cx, cy, x1, y1, r0, r1, r, o) =>
        S.horn(X(x0, y0), Y(x0, y0), X(cx, cy), Y(cx, cy), X(x1, y1), Y(x1, y1), r0 * k, r1 * k, r, o),
      poly: (pts, r, o = {}) => {
        const q = pts.map(p => [X(p[0], p[1]), Y(p[0], p[1])]);
        if (o.grad) { const g = o.grad; o = Object.assign({}, o, { grad: [X(g[0], g[1]), Y(g[0], g[1]), X(g[2], g[3]), Y(g[2], g[3]), g[4], g[5]] }); }
        S.poly(q, r, o);
      },
      tri: (a, b, c, r, o) => V.poly([a, b, c], r, o),
      ellipse: (x, y, rx, ry, c) => S.ellipse(X(x, y), Y(x, y), rx * k, ry * k, c),
      line: (x0, y0, x1, y1, c) => S.line(X(x0 + 0.5, y0 + 0.5) - 0.5, Y(x0 + 0.5, y0 + 0.5) - 0.5, X(x1 + 0.5, y1 + 0.5) - 0.5, Y(x1 + 0.5, y1 + 0.5) - 0.5, c),
      px: (x, y, c) => S.set(Math.floor(X(x + 0.5, y + 0.5)), Math.floor(Y(x + 0.5, y + 0.5)), c),
      glow: (x, y, c, r) => S.glow(Math.floor(X(x + 0.5, y + 0.5)), Math.floor(Y(x + 0.5, y + 0.5)), c, r),
      erase: (x, y) => S.set(Math.floor(X(x + 0.5, y + 0.5)), Math.floor(Y(x + 0.5, y + 0.5)), 0),
      rect: (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) V.px(x + i, y + j, c); },
    };
    return V;
  };

  // Paint into a fresh layer, then composite it over S. Where the layer's
  // edge lies over existing paint, draw a contour line so overlapping forms
  // of the same ramp stay separate (an arm across a chest). `line` may be a
  // colour or fn(underHex) -> colour; o.skipLit leaves the upper-left edge open.
  const layer = (S, t, fn, line = '#101', o = {}) => {
    const L = K.create(S.w, S.h);
    fn(view(L, t), L);
    const w = S.w, h = S.h, src = L.data, dst = S.data;
    if (line) {
      const fixed = typeof line === 'string' ? P.toInt(line) : 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (src[i] || !dst[i]) continue;
        const r = x < w - 1 && src[i + 1], l = x > 0 && src[i - 1], d = y < h - 1 && src[i + w], u = y > 0 && src[i - w];
        if (!(r || l || d || u)) continue;
        if (o.skipLit && !(l || u)) continue;   // only lines on the bottom/right of the layer
        dst[i] = fixed || P.toInt(line(P.fromInt(dst[i])));
      }
    }
    for (let i = 0; i < src.length; i++) if (src[i]) dst[i] = src[i];
    return L;
  };

  // Shift a colour along a ramp (texture: fur, scales, grime).
  const shifter = (ramp, d) => {
    ramp = P.ramp(ramp);
    const idx = new Map(ramp.map((c, i) => [c, i]));
    return hex => {
      const i = idx.get(hex);
      if (i === undefined) return hex;
      return ramp[U.clamp(i + d, 0, ramp.length - 1)];
    };
  };
  const inRamp = (S, ramp) => {
    const set = new Set(P.ramp(ramp).map(c => P.toInt(c)));
    return (x, y) => set.has(S.get(x, y));
  };

  // Short hair strokes over pixels of a ramp — mangy fur.
  const strands = (S, ramp, x0, y0, w, h, n, seed, dx = 1, dy = 1, d = -1) => {
    const r = U.rng(seed), sh = shifter(ramp, d), test = inRamp(S, ramp);
    for (let i = 0; i < n; i++) {
      const x = Math.floor(x0 + r() * w), y = Math.floor(y0 + r() * h);
      if (!test(x, y)) continue;
      const len = 1 + Math.floor(r() * 2.5);
      for (let k = 0; k < len; k++) {
        const px = x + Math.round(dx * k), py = y + Math.round(dy * k);
        if (test(px, py)) S.set(px, py, sh(S.getHex(px, py)));
      }
    }
  };

  // A motion smear: a crescent band along a quadratic curve, densest at
  // the leading end (x1,y1). Painted after the outline, only on empty pixels.
  const smear = (S, x0, y0, cx, cy, x1, y1, wid, cols = ['#457', '#89b', '#cde']) => {
    const n = Math.ceil((Math.hypot(cx - x0, cy - y0) + Math.hypot(x1 - cx, y1 - cy)) * 3);
    const done = new Set();
    for (let i = 0; i <= n; i++) {
      const t = i / n, it = 1 - t;
      const x = it * it * x0 + 2 * it * t * cx + t * t * x1;
      const y = it * it * y0 + 2 * it * t * cy + t * t * y1;
      const tx = 2 * it * (cx - x0) + 2 * t * (x1 - cx), ty = 2 * it * (cy - y0) + 2 * t * (y1 - cy);
      const tl = Math.hypot(tx, ty) || 1, nx = -ty / tl, ny = tx / tl;
      const ww = wid * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), 0.6) + 0.5;
      for (let s2 = -ww; s2 <= ww; s2 += 0.4) {
        const px = Math.floor(x + nx * s2), py = Math.floor(y + ny * s2);
        const key = px * 512 + py;
        if (done.has(key) || px < 0 || py < 0 || px >= S.w || py >= S.h || S.opaque(px, py)) continue;
        done.add(key);
        const core = 1 - Math.abs(s2) / (ww + 0.01);
        const v = Math.min(1, t * 1.3) * (0.45 + 0.55 * core);
        if (v < P.thresh(px, py) * 0.85 + 0.08) continue;
        S.set(px, py, cols[Math.min(cols.length - 1, Math.floor(v * cols.length))]);
      }
    }
  };

  // Pose -> which key: idle | windL/H/R | strikeL/H/R | hurt
  const breathOf = f => [0, 0.5, 1, 0.5][f];
  const poseKey = q => {
    if (q.hurt) return 'hurt';
    const side = q.dir < 0 ? 'L' : q.dir > 0 ? 'R' : 'H';
    if (q.strike) return 'strike' + side;
    if (q.wind) return 'wind' + side;
    return 'idle';
  };

  // Rig evaluation. KEY.idle(b, f) gives the breathing idle pose; every
  // other key is fn(w, idle) -> a complete pose (w = 0.5 or 1 for wind-ups).
  // half(idle, full, over) blends part-way and applies explicit overrides,
  // so half wind-ups travel along arcs instead of straight through the body.
  const rig = (KEY, q) => {
    const k = poseKey(q);
    const idle = KEY.idle(k === 'idle' ? breathOf(q.f) : 0, q.f);
    if (k === 'idle') return idle;
    return KEY[k](q.wind >= 1 || !k.startsWith('wind') ? 1 : 0.5, idle);
  };
  const half = (idle, full, over, t = 0.55) => Object.assign(mix(idle, full, t), over || {});

  // IK that picks the elbow/knee solution pointing along `pref` [x,y].
  const joint = (a, c, l1, l2, pref) => {
    const p1 = ik(a[0], a[1], c[0], c[1], l1, l2, 1), p2 = ik(a[0], a[1], c[0], c[1], l1, l2, -1);
    const mx = (a[0] + p1[2]) / 2, my = (a[1] + p1[3]) / 2;
    const d1 = (p1[0] - mx) * pref[0] + (p1[1] - my) * pref[1];
    const d2 = (p2[0] - mx) * pref[0] + (p2[1] - my) * pref[1];
    return d1 >= d2 ? p1 : p2;
  };

  const INK = '#101';

  // ---------------------------------------------------------------
  // Weapons
  // ---------------------------------------------------------------
  // Spiked club: grip at (x,y), pointing along `ang`, length len.
  // fs > 1 swells the head (foreshortened toward the viewer).
  const spikedClub = (V, x, y, ang, len, fs = 1) => {
    const c = Math.cos(ang), s = Math.sin(ang);
    const bx = x - c * 4, by = y - s * 4;                 // pommel end
    const tx = x + c * len, ty = y + s * len;              // club head end
    const nx = -s, ny = c;
    const rHead = 4.3 * fs;
    const spike = (x0, y0, x1, y1, r) => V.capsule(x0, y0, x1, y1, r, 0.35, 'steel', { lo: 3, spec: 0.9 });
    // spikes first so the wood overlaps their roots
    for (const [t, side] of [[0.42, 1], [0.55, -1], [0.66, 1], [0.78, -1], [0.88, 1], [0.95, -1]]) {
      const px = lerp(bx, tx, t), py = lerp(by, ty, t);
      const r = lerp(1.8, rHead, Math.pow(t, 0.8));
      spike(px, py, px + nx * side * (r + 3.4 * fs), py + ny * side * (r + 3.4 * fs), 1.4 * Math.min(fs, 1.3));
    }
    spike(tx, ty, tx + c * (rHead + 2.5), ty + s * (rHead + 2.5), 1.4);
    V.capsule(bx, by, tx, ty, 1.7, rHead, 'wood', { lo: 1, spec: 0.3 });
    if (fs > 1.2) {
      // the head end faces us: a knotted cap ringed with nails
      V.ball(tx, ty, rHead + 0.6, rHead + 0.6, 'wood', { lo: 1, spec: 0.35 });
      if (fs >= 1.5) {
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * TAU + 0.3, ca = Math.cos(a), sa = Math.sin(a);
          V.capsule(tx + ca * rHead * 0.8, ty + sa * rHead * 0.8, tx + ca * (rHead + 2.6), ty + sa * (rHead + 2.6), 1.2, 0.3, 'steel', { lo: 2, hi: 7, spec: 0.5 });
        }
        V.ball(tx + c * 0, ty, rHead * 0.92, rHead * 0.92, 'wood', { lo: 1, spec: 0.35 });
      }
      for (const [ox, oy] of [[-0.4, -0.3], [0.35, -0.1], [-0.1, 0.4]]) {
        V.ball(tx + ox * rHead * 1.2, ty + oy * rHead * 1.2, 1.2, 1.2, 'steel', { lo: 3, spec: 1 });
      }
    }
    // iron band and nail heads
    const kx = lerp(bx, tx, 0.36), ky = lerp(by, ty, 0.36), kr = lerp(1.8, rHead, 0.36) + 0.7;
    V.capsule(kx - nx * kr, ky - ny * kr, kx + nx * kr, ky + ny * kr, 1, 1, 'steel', { lo: 1, hi: 6 });
    for (const t of [0.6, 0.76]) {
      const px = lerp(bx, tx, t), py = lerp(by, ty, t);
      V.px(Math.floor(px - nx * 1.5 - 0.5), Math.floor(py - ny * 1.5 - 0.5), '#bcd');
    }
    return [tx, ty];
  };

  // ===============================================================
  // GOBLIN — M 88x96. Wiry, hunched, cackling; spiked club.
  // ===============================================================
  // sickly green: purple-teal shadows -> yellow-green lights
  const GOB_SKIN = ['#102', '#112', '#222', '#232', '#342', '#453', '#574', '#795', '#9a5'];

  // Heavy cleaver-axe. Grip (x,y), haft along ang, `len` from grip to the

  const cleaverAxe = (V, x, y, ang, len, side = 1, fs = 1, spike = true) => {
    const c = Math.cos(ang), s = Math.sin(ang);
    const nx = -s * side, ny = c * side;

    const pts = [at(b0 + 3, 1), at(b1, 1), at(b1 + 1.5, bl * 0.55), at(b1 + 3, bl), at(b0 - 3, bl + 1.5), at(b0 + 1, bl * 0.5)];
    V.poly(pts, IRON, { grad: [...at(len - 8, 2), ...at(len - 8, bl), 0.6, 0.2], lo: 1, hi: 8 });
    // bright bevelled cutting edge
    const e0 = at(b1 + 3, bl), e1 = at(b0 - 3, bl + 1.5);
    V.line(e0[0], e0[1], e1[0], e1[1], '#cde');
    const f0 = at(b1 + 2, bl - 1.4), f1 = at(b0 - 2, bl);
    V.line(f0[0], f0[1], f1[0], f1[1], '#889');
    // notches bitten out of the edge
    for (const t of [0.3, 0.7]) {
      const q = at(lerp(b1 + 3, b0 - 3, t), bl + lerp(0, 1.5, t));
      V.erase(q[0], q[1]);
      const q2 = at(lerp(b1 + 3, b0 - 3, t), bl - 1 + lerp(0, 1.5, t)); V.px(q2[0], q2[1], '#223');
    }
    // iron socket, top spike, rivets
    V.capsule(...at(b0 + 2, 0), ...at(b1, 0), 2.7, 2.7, IRON, { lo: 1, spec: 0.6 });
    if (spike) V.capsule(...at(b1, 0), ...at(b1 + 5, 0), 1.6, 0.4, IRON, { lo: 2, spec: 0.8 });
    for (const t of [b0 + 4, b1 - 2]) { const q = at(t, 4); V.px(q[0], q[1], '#bcd'); }
    // rust blooms
    const r = U.rng(77);
    for (let i = 0; i < 16; i++) {
      const q = at(lerp(b0, b1, r()), lerp(3, bl - 2, r()));
      if (V.S.opaque(Math.floor(V.X(q[0], q[1])), Math.floor(V.Y(q[0], q[1])))) V.px(q[0], q[1], r() < 0.5 ? '#731' : '#520');

    return m;
  };

    windR: (w, I) => {
      const full = Object.assign({}, I, {
        t: { k: 1, dx: 2, dy: 0, sh: 0.07 },
        chest: [46, 44], head: [47, 26], turn: 1,
        shL: [32, 38], shR: [64, 36],
        handR: [56, 29], grip: 9, elL: [0, 1], elR: [1, 0.6],
        axe: -1.14, axeLen: 24, axeSide: 1, axeFs: 0.95, axeFront: false, mouth: 0.6, brow: 1,
      });
      return w < 1 ? half(I, full, { handR: [54, 44], axe: -1.15, axeLen: 28, elL: [0, 1], t: { k: 1, dx: 1, dy: 0, sh: 0.035 } }) : full;
    },
    windH: (w, I) => {
      const full = Object.assign({}, I, {
        t: { k: 0.96, dx: 0, dy: 0, sh: 0 },
        pelvis: [44, 63], chest: [44, 42], head: [44, 26],
        shL: [25, 34], shR: [63, 34],
        handR: [46, 21], handL: [42, 22], grip: 0, elL: [-1, -1.2], elR: [1, -1.2], behind: true,
        axe: -1.57, axeLen: 17, axeSide: 1, axeFs: 0.9, axeFront: false, spike: true, mouth: 0.9, brow: 1,
      });
      return w < 1 ? half(I, full, { handR: [47, 29], handL: [41, 30], axeLen: 13, behind: true, t: { k: 0.98, dx: 0, dy: 0, sh: 0 } }) : full;
    },
    strikeL: (w, I) => Object.assign({}, I, {
      t: { k: 1.06, dx: 1, dy: 0, sh: 0.04 },
      pelvis: [44, 66], chest: [45, 47], head: [45, 30], turn: 1,
      shL: [26, 39], shR: [63, 40],
      handR: [48, 62], grip: 9, elL: [-0.2, 1], elR: [1, 0.5],
      axe: 0.15, axeLen: 21, axeSide: -1, axeFs: 1.05, axeFront: true, mouth: 1, brow: 1,
      smear: [[10, 8], [-6, 56]],
    }),
    strikeR: (w, I) => Object.assign({}, I, {
      t: { k: 1.06, dx: -1, dy: 0, sh: -0.04 },
      pelvis: [44, 66], chest: [43, 47], head: [43, 30], turn: -1,
      shL: [25, 40], shR: [62, 39],
      handR: [40, 62], grip: 9, elL: [-1, 0.5], elR: [0.2, 1],
      axe: 3.0, axeLen: 21, axeSide: 1, axeFs: 1.05, axeFront: true, mouth: 1, brow: 1,
      smear: [[78, 8], [94, 56]],
    }),
    strikeH: (w, I) => Object.assign({}, I, {
      t: { k: 1.06, dx: 0, dy: 0, sh: 0 },
      pelvis: [44, 66], chest: [44, 47], head: [44, 31],
      shL: [26, 40], shR: [62, 40],
      handR: [44, 55], grip: -6, elL: [-1, 0.4], elR: [1, 0.4],
      axe: 1.57, axeLen: 20, axeSide: -1, axeFs: 1.45, axeFront: true, mouth: 1, brow: 1,
      smear: [[28, -2], [16, 36]], smear2: [[60, -2], [72, 36]],
    }),
    hurt: (w, I) => Object.assign({}, I, {
      t: { k: 0.97, dx: 2, dy: 0, sh: -0.05 },
      chest: [45, 43], head: [47, 25], turn: 2,
      shL: [27, 36], shR: [64, 37],
      handL: [14, 42], handR: [64, 58], elL: [-1, 0.2], elR: [1, 1],
      axe: -1.42, axeLen: 36, mouth: 1, eyes: 0, brow: 0,
    }),
  };

  orc.head = (V, x, y, p) => {
    const ex = (p.turn || 0);
    // black topknot bound with a ring, tail swinging behind
    const kn = p.knot || 0;
    V.horn(x + 2, y - 11, x + 9 + kn, y - 15, x + 10 + kn, y - 4, 2.4, 1.2, HAIR, { spec: 0.6 });
    V.ball(x + 1, y - 12, 3.6, 2.8, HAIR, { spec: 0.6 });
    V.px(x + 4, y - 12, '#a70'); V.px(x + 4, y - 11, '#eb3');
    // swept-back pointed ears with rings
    V.poly([[x - 8, y - 3], [x - 16, y - 9], [x - 13, y - 4], [x - 8, y + 2]], ORC_SKIN, { n: [-0.5, -0.4, 0.75] });
    V.poly([[x + 8, y - 3], [x + 16, y - 9], [x + 13, y - 4], [x + 8, y + 2]], ORC_SKIN, { n: [0.6, -0.2, 0.75] });
    V.px(x + 12, y - 3, '#eb3'); V.px(x + 12, y - 2, '#a70'); V.px(x - 12, y - 3, '#c92');
    // skull and the huge underslung jaw
    V.ball(x + ex * 0.2, y - 4, 8.6, 8, ORC_SKIN, { spec: 0.15 });
    V.ball(x + ex * 0.4, y + 3, 10.5, 6.5, ORC_SKIN);
    V.px(x - 4, y - 10, '#898'); V.px(x - 3, y - 10, '#898');
    // war paint: a red band across the eyes
    V.poly([[x - 10, y - 5], [x + 10, y - 5], [x + 10, y - 0.5], [x - 10, y - 0.5]], R.crimson, { grad: [x - 8, y - 5, x + 8, y, 0.62, 0.28], lo: 1, hi: 7,
      clip: (px, py) => V.S.opaque(px, py) });
    // heavy brow
    const bx = x + ex * 0.7, bb = p.brow ? 1 : 0;
    V.poly([[bx - 9, y - 7 + bb], [bx + 9, y - 7 + bb], [bx + 8, y - 4 + bb], [bx + 1, y - 3 + bb * 2], [bx - 1, y - 3 + bb * 2], [bx - 8, y - 4 + bb]], ORC_SKIN, { n: [-0.25, -0.8, 0.5] });
    V.line(bx - 8, y - 3 + bb, bx - 2, y - 2 + bb * 2, '#101'); V.line(bx + 2, y - 2 + bb * 2, bx + 8, y - 3 + bb, '#101');
    // small, mean eyes glinting under the brow
    for (const sx of [-1, 1]) {
      const cx = bx + sx * 4, ey = y - 2 + bb;
      V.line(cx - 2, ey, cx + 1, ey, '#101');
      if (p.eyes) { V.px(cx, ey, '#fd5'); V.px(cx - sx, ey, '#e70'); }
      else V.line(cx - 2, ey + 1, cx + 2, ey + 1, '#101');
    }
    // broad flat nose
    V.ball(bx, y + 0.5, 3, 2.3, ORC_SKIN, { spec: 0.4 });
    V.px(bx - 2, y + 2, '#101'); V.px(bx + 1, y + 2, '#101');
    // scar through the left brow and cheek
    V.line(bx - 6, y - 8, bx - 3, y + 3, '#787');
    V.px(bx - 7, y - 7, '#565'); V.px(bx - 2, y + 2, '#565');
    // mouth with an underbite; tusks jut up from the lower jaw
    const m = p.mouth || 0, mx = bx, my = y + 5;
    if (m > 0.5) {
      V.ellipse(mx, my + 1, 6.4, 1.5 + m * 2, '#101');
      V.ellipse(mx, my + 1.8, 3.6, 0.6 + m, '#502');
      for (const tx of [-2, 0, 2]) V.px(mx + tx, my - 1, '#ddc');
      for (const tx of [-3, 3]) V.px(mx + tx, my + 2 + m * 1.6, '#bba');
    } else {
      V.line(mx - 6, my, mx + 6, my, '#101');
      V.line(mx - 4, my + 1, mx + 4, my + 1, '#222');
      if (m > 0) V.line(mx - 2, my + 1, mx + 2, my + 1, '#101');
    }
    const ty = m > 0.5 ? 2 : 0;
    V.horn(mx - 5, my + 2 + ty, mx - 7, my - 1 + ty, mx - 6, my - 5 + ty, 1.8, 0.6, R.bone, { lo: 3, spec: 0.5 });
    V.horn(mx + 5, my + 2 + ty, mx + 7, my - 1 + ty, mx + 6, my - 5 + ty, 1.8, 0.6, R.bone, { lo: 2, hi: 7, spec: 0.3 });
  };

  orc.arm = (V, sh, hand, pref, lo, open) => {
    const [ex, ey] = joint(sh, hand, 15, 14, pref);
    V.ball(sh[0], sh[1] + 1, 7, 6.5, ORC_SKIN, { lo });                       // deltoid
    V.capsule(sh[0], sh[1], ex, ey, 6.2, 4.6, ORC_SKIN, { lo });
    V.ball(lerp(sh[0], ex, 0.45), lerp(sh[1], ey, 0.45), 5.6, 5.6, ORC_SKIN, { lo, spec: 0.15 }); // biceps
    V.capsule(ex, ey, hand[0], hand[1], 5.2, 3.8, ORC_SKIN, { lo });
    // iron-banded leather wrist wrap
    const wx = lerp(ex, hand[0], 0.68), wy = lerp(ey, hand[1], 0.68);
    V.capsule(lerp(ex, hand[0], 0.55), lerp(ey, hand[1], 0.55), lerp(ex, hand[0], 0.82), lerp(ey, hand[1], 0.82), 4.6, 4.3, LEATHER, { lo: 1, spec: 0.2 });
    V.px(wx - 1, wy - 1, '#9ab');
    if (!open) fist(V, hand[0], hand[1], 4.6, ORC_SKIN, { lo });
    else {
      V.ball(hand[0], hand[1], 4.4, 4, ORC_SKIN, { lo });
      for (const d of [-3, -1, 1, 3]) V.capsule(hand[0] + d, hand[1] + 2, hand[0] + d * 1.5, hand[1] - 5, 1.1, 0.9, ORC_SKIN, { lo });
    }
    return [ex, ey];
  };

  orc.leg = (V, hip, foot, pref, lo) => {
    const dir = foot[0] < 44 ? -1 : 1;
    const ank = [foot[0], foot[1] - 5];
    const [kx, ky] = joint(hip, ank, 14, 13, pref);
    V.capsule(hip[0], hip[1], kx, ky, 7.6, 5.6, ORC_SKIN, { lo });
    V.ball(kx, ky, 5, 4.4, ORC_SKIN, { lo, spec: 0.2 });
    V.capsule(kx, ky, ank[0], ank[1], 5.2, 4.2, ORC_SKIN, { lo });
    // shin wraps
    for (let t = 0.3; t < 0.8; t += 0.18) V.line(lerp(kx, ank[0], t) - 4, lerp(ky, ank[1], t), lerp(kx, ank[0], t) + 4, lerp(ky, ank[1], t) + 2, '#210');
    // ankle boots with fur cuff and an iron toe cap
    V.ball(foot[0] + dir * 2, foot[1] - 3, 7.2, 3.8, LEATHER, { lo: 1, hi: 5 - lo });
    V.capsule(ank[0] - 4.5, ank[1] - 0.5, ank[0] + 4.5, ank[1] - 0.5, 2, 2, R.fur, { lo: 1, hi: 6 - lo });
    V.ball(foot[0] + dir * 6, foot[1] - 2.5, 3, 2.4, IRON, { lo: 1, spec: 0.6 });
  };

  orc.draw = (S, q) => {
    const p = rig(orc.KEY, q);
    const T = Object.assign({ ax: 44, ay: 94 }, p.t);
    const V = view(S, T);
    const [px, py] = p.pelvis, [cx, cy] = p.chest, [hx, hy] = p.head;
    // the second hand rides the haft when two-handed (grip<0: explicit)
    const hL = p.grip ? [p.handR[0] + Math.cos(p.axe) * p.grip, p.handR[1] + Math.sin(p.axe) * p.grip] : p.handL;
    const two = p.grip !== 0;
    let tip = null;
    const axeDraw = VV => { tip = cleaverAxe(VV, p.handR[0], p.handR[1], p.axe, p.axeLen, p.axeSide, p.axeFs, p.spike); };
    if (!p.axeFront) layer(S, T, axeDraw, null);
    // legs
    orc.leg(V, [px - 8, py + 2], p.footL, [-1, -0.1], 0);
    orc.leg(V, [px + 8, py + 2], p.footR, [1, -0.1], 1);
    // studded leather strips hanging from the belt
    const strips = [[-15, 13, 0.75], [-9, 15, 0.6], [-3, 14, 0.5], [3, 15, 0.4], [9, 13, 0.3], [14, 12, 0.2]];
    for (const [ox, len, tn] of strips) {
      V.poly([[px + ox - 3, py - 1], [px + ox + 3, py - 1], [px + ox + 3, py + len], [px + ox, py + len + 1], [px + ox - 3, py + len]], LEATHER, { grad: [px + ox, py, px + ox, py + len, tn + 0.25, tn - 0.1], lo: 1 });
      V.line(px + ox + 3, py, px + ox + 3, py + len, '#100');
      V.px(px + ox, py + len - 3, '#9ab');
    }
    // torso: gut, barrel chest, trapezius hump
    V.ball(px, py - 7, 15, 10, ORC_SKIN, { lo: 0.5 });
    V.ball(cx, cy, 19, 13.5, ORC_SKIN, { spec: 0.08 });
    V.ball(cx, cy - 9, 13, 7, ORC_SKIN);
    // pecs, sternum, abs
    V.line(cx - 13, cy + 3, cx - 2, cy + 6, '#222'); V.line(cx + 2, cy + 6, cx + 13, cy + 3, '#122');
    V.line(cx, cy - 3, cx, cy + 12, '#222');
    for (const yy of [10, 14]) { V.line(cx - 6, cy + yy, cx - 2, cy + yy, '#333'); V.line(cx + 2, cy + yy, cx + 6, cy + yy, '#222'); }
    V.px(cx - 8, cy - 2, '#676'); V.px(cx - 7, cy - 3, '#676');
    // old scar across the gut
    V.line(cx + 4, cy + 8, cx + 11, cy + 4, '#676'); V.line(cx + 4, cy + 9, cx + 11, cy + 5, '#222');
    // war paint: three red claw stripes over the left pec
    for (const ox of [-12, -8, -4]) {
      V.line(cx + ox, cy - 6, cx + ox + 3, cy + 3, '#a12'); V.line(cx + ox + 1, cy - 6, cx + ox + 4, cy + 3, '#c32');
    }
    // leather harness strap with studs + wide belt
    V.poly([[p.shR[0] - 3, p.shR[1] - 4], [p.shR[0] + 2, p.shR[1] - 2], [px - 11, py - 3], [px - 16, py - 5]], LEATHER, { tone: 0.55, lo: 1 });
    for (let t = 0.12; t < 1; t += 0.2) V.px(lerp(p.shR[0] - 1, px - 13, t), lerp(p.shR[1] - 3, py - 4, t), '#9ab');
    V.poly([[px - 17, py - 6], [px + 17, py - 6], [px + 17, py], [px - 17, py]], LEATHER, { grad: [px, py - 6, px, py, 0.65, 0.2], lo: 1 });
    V.line(px - 17, py - 6, px + 17, py - 6, '#531');
    // iron buckle cast as a crude skull
    V.ball(px, py - 3, 4.2, 3.6, 'steel', { lo: 1, hi: 7, spec: 0.6 });
    V.px(px - 2, py - 4, '#101'); V.px(px + 1, py - 4, '#101'); V.px(px - 1, py - 2, '#223'); V.px(px, py - 1, '#223');
    if (p.behind) {
      // arms raised with the hands hidden behind the head
      layer(S, T, VV => orc.arm(VV, p.shL, hL, p.elL, 0.3, false), '#122');
      layer(S, T, VV => orc.arm(VV, p.shR, p.handR, p.elR, 0.8, false), '#122');
      V.ball(hx, hy + 9, 9, 5, ORC_SKIN, { lo: 0.5 });          // thick neck in front of the arms
    }
    // head
    orc.head(V, hx, hy, p);
    // far arm, pauldron, axe, near arm
    if (!p.behind) layer(S, T, VV => orc.arm(VV, p.shL, hL, p.elL, 0, q.hurt), '#122');
    layer(S, T, VV => {
      const [sx, sy] = p.shL;
      // crude iron pauldron: lames stepping down over the deltoid, one spike
      const ox = sx - 3, oy = sy + 1;
      VV.capsule(ox - 2, oy - 4, ox - 6, oy - 12, 2, 0.4, IRON, { lo: 2, spec: 0.9 });
      VV.ball(ox - 2, oy + 5, 8.5, 3.2, IRON, { lo: 1, hi: 5, rot: -0.3 });
      VV.ball(ox - 1, oy + 2, 9, 3.6, IRON, { lo: 1, hi: 6, rot: -0.3 });
      VV.ball(ox + 0.5, oy - 1.5, 8.5, 4.4, IRON, { lo: 1, hi: 8, rot: -0.3, spec: 0.5 });
      VV.line(ox - 8, oy + 2, ox + 7, oy - 3, '#111'); VV.line(ox - 9, oy + 5, ox + 6, oy + 0, '#111');
      for (const [rx, ry] of [[-5, -2], [0, -4], [5, -4], [-6, 3], [2, 1]]) VV.px(ox + rx, oy + ry, '#bbc');
      const r = U.rng(9);
      for (let i = 0; i < 14; i++) VV.px(ox - 8 + r() * 15, oy - 4 + r() * 10, r() < 0.5 ? '#731' : '#520');
    }, '#101');
    if (p.axeFront) layer(S, T, axeDraw, '#101');
    if (!p.behind) layer(S, T, VV => orc.arm(VV, p.shR, p.handR, p.elR, 0.6, false), '#122');
    if (two && !p.behind) layer(S, T, VV => fist(VV, hL[0], hL[1], 4.6, ORC_SKIN), '#122');
    S.outline(INK);
    if (p.smear && tip) {
      const X = (x, y) => T.ax + (x - T.ax) * T.k + T.dx + (T.ay - y) * T.sh, Y = (x, y) => T.ay + (y - T.ay) * T.k;
      for (const sm of [p.smear, p.smear2]) if (sm) smear(S, sm[0][0], sm[0][1], sm[1][0], sm[1][1], X(tip[0], tip[1]), Y(tip[0], tip[1]), 4);
    }
  };

  orc.portrait = S => {
    const p = OI(0, 0);
    const k = 0.78;
    const V = view(S, { ax: 0, ay: 0, k, dx: 12 - 44 * k, dy: 11 - 27 * k });
    V.ball(44, 46, 22, 12, ORC_SKIN);
    V.ball(44, 37, 13, 7, ORC_SKIN);
    V.ball(23, 40, 8.5, 4.4, IRON, { lo: 1, hi: 8, rot: -0.3, spec: 0.5 });
    orc.head(V, 44, 27, p);
    S.outline(INK);
  };

  E['Orc'] = {
    w: 88, h: 96, anchor: [44, 94], center: [44, 46], mouth: [44, 31],
    draw: orc.draw, portrait: orc.portrait,
  };
})();
